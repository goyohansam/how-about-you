        <div class="chip-shelf" style="justify-content:center">${LAW[n].chips.map(c=>chipBadge(c, !!anim)).join('')}</div>
      </div>`), nx);
      if(anim) nx.scrollIntoView({behavior:'smooth', block:'center'});
    }
  }
  L.cards.forEach((c,ci)=>{
    if(!c.key || solvedArr.indexOf(ci)>-1) return;
    sc.querySelectorAll(`#qz${ci} .qchip`).forEach(b=>{
      b.onclick = ()=>{
        if(b.dataset.o===c.key){
          const bl = sc.querySelector(`#bl${ci}`);
          bl.textContent = c.key; bl.classList.add('filled');
          sc.querySelector(`#qz${ci}`).remove();
          sc.querySelector(`#sb${ci}`).style.display='block';
          sc.querySelector(`#lc${ci}`).appendChild(el(`<span class="won-mark" style="color:${c.cl}">✓</span>`));
          solved++;
          solvedArr.push(ci);
          saveProgress();
          unlockCheck(true);
        } else {
          b.classList.add('no');
        }
      };
    });
  });
  unlockCheck(false);
  // 생각 조각 — 이 기기에만 저장 (서버 전송 없음)
  const ta = sc.querySelector('#ta'), sv = sc.querySelector('#sv'), fb = sc.querySelector('#fb');
  if(S.notes[n]){
    ta.value = S.notes[n].t;
    ta.readOnly = true; ta.style.opacity=.75; sv.style.display='none';
    fb.innerHTML = `<div class="think-fb"><span class="fb-badge">🧩 생각 조각 (${Object.keys(S.notes).length}/4)</span><br>이미 담아 둔 생각이에요. 마지막 거울에서 다시 만나요.</div>`;
  } else {
    ta.value = S.ui.drafts['law'+n] || '';
    ta.addEventListener('input', ()=>{ S.ui.drafts['law'+n] = ta.value; });
    ta.addEventListener('blur', saveProgress);
    sv.onclick = ()=>{
      const t = ta.value.trim();
      if(!t){ fb.innerHTML = `<div class="think-fb">아직 빈 칸이에요. 한 문장이면 충분해요 — 지금 머릿속에 스친 것을 그대로 적어도 돼요.</div>`; return; }
      S.notes[n] = { q:L.q, t:t };
      delete S.ui.drafts['law'+n];
      saveProgress();
      ta.readOnly = true; ta.style.opacity=.75; sv.style.display='none';
      fb.innerHTML = `<div class="think-fb"><span class="fb-badge">🧩 생각 조각 획득! (${Object.keys(S.notes).length}/4)</span><br>${thinkFeedback(t)}</div>`;
    };
  }
  sc.querySelector('#nx').onclick = ()=>nav(scrMini, n);
  coach('law','빈칸을 채우면 설명이 열려요. 모르는 낱말은 밑줄을 눌러 보세요.');
}

/* ══════════ 7. 미니 거울 (시나리오별) ══════════ */
const MIRROR_MAP = { 1:[0,1], 2:[2], 3:[3], 4:[4] };
const MIRROR_GOOD = { 1:['repair','voice'], 2:['late','respect'], 3:['verify','correct'], 4:['late','partner'] };
/* 속마음↔겉행동 비교용 — '겉으로 한 첫 행동(c1)'이 좋은 쪽이었는지. */
const GOOD_FIRST = { 1:['speak','dm'], 2:['askgroup','askdm'], 3:['ask','search'], 4:['object','private'] };
/* 속마음이 이미 '옳은 쪽'으로 기울어 있었는지(자각형) */
const AWARE_INNER = ['hmm','jiho','worry','odd','doubt','doyun'];
/* 이중 질문 비교용 — 선택지를 '마음의 방향'으로 묶는다. */
const DUAL_DIR = {
  2:{ pile:'같이 몰아세우는', quiet:'지켜보는', askgroup:'먼저 물어보는', askdm:'먼저 물어보는' }
};
function dualCompare(n, ik, rk){
  if(ik===rk) return {state:'same'};
  const d = DUAL_DIR[n];
  if(d && d[ik] && d[ik]===d[rk]) return {state:'dir', name:d[ik]};
  return {state:'diff'};
}
function splitEmoji(x){
  const m = x.match(/^(\S+)\s+(.+)$/);
  return m ? {e:m[1], t:m[2]} : {e:'💭', t:x};
}
function mmDots(v){
  let d=''; for(let i=1;i<=5;i++) d+=`<i class="${i<=v?'on':''}"></i>`;
  return `<div class="mm-dots">${d}<span class="mm-score">${v}점</span></div>
    <div class="mm-scale"><span>전혀 아니다</span><span>매우 그렇다</span></div>`;
}
function scrMini(n){
  if(!S.done[n]){ navHome(); return; }
  const stance = S.done[n].stance;
  const good = MIRROR_GOOD[n].includes(stance);
  const stColor = STANCE_META[n][stance].c;
  const ex = S.extra[n]||{};
  let deepRows = '';
  if(ex.said){
    deepRows += `<div class="mm-card" style="border-color:#F2C480;background:#FFFDF6">
      <div class="mm-lb" style="color:#B8860B">✏️ 내가 직접 쓴 말</div>
      <div class="mm-q" style="margin-bottom:10px">“${esc(ex.said.t)}”</div>
      <div style="font-size:15px;color:var(--paper-dim);line-height:1.7">이 앱은 이 말을 <b style="color:var(--paper)">‘${C1L[n][ex.said.k]||ex.said.k}’</b> 쪽으로 읽고 이야기를 이어 갔어요.
      낱말을 보고 가장 가까운 길을 고른 것뿐이라, 진짜 마음과 다르게 읽혔을 수도 있어요.
      다르게 읽혔다면 — 내 말이 어느 길이었는지는 <b>스스로 정해 보세요.</b> 그 판단이 이 화면보다 정확해요.</div>
    </div>`;
  }
  if(ex.inner){
    const c1 = S.done[n].c1;
    const act = C1L[n][c1] || '';
    const io = splitEmoji(ex.inner.x);
    const aware = AWARE_INNER.includes(ex.inner.k);
    const goodAct = (GOOD_FIRST[n]||[]).includes(c1);
    const actColor = goodAct ? '#2E9E74' : '#8A94A6';
    let linkCls, linkTxt, note;
    if(aware && goodAct){
      linkCls='same'; linkTxt='⇉ 속마음도 행동도 같은 방향이에요';
      note='마음이 기운 쪽으로 몸도 그대로 움직였어요. 생각과 행동이 하나였던 거예요. 드물고, 멋진 일이에요.';
    } else if(!aware && goodAct){
      linkCls='same'; linkTxt='⭐ 속마음을 넘어선 순간이에요';
      note='처음엔 마음이 다른 쪽으로 살짝 기울었는데, 행동은 좋은 쪽으로 옮겨 갔어요. 이건 간격이 아니라 극복이에요. 흔들리고도 결국 옳게 행동하는 것 — 그게 제일 어려운 건데, 방금 당신이 해냈어요.';
    } else if(aware && !goodAct){
      linkCls='diff'; linkTxt='⇄ 속마음과 행동 사이에 간격이 있어요';
      note='마음은 이미 알고 있었어요. 그런데 행동은 거기까지 가지 못했어요. 그 사이에 무엇이 있었을까요? 분위기, 친구들 눈, 귀찮음… 딱 하나만 떠올려 보세요. 그게 뭔지 아는 사람은 세상에 당신뿐이에요.';
    } else {
      linkCls='same'; linkTxt='⇉ 속마음과 행동이 솔직하게 만났어요';
      note='마음이 기운 대로 몸도 움직였어요. 그것도 솔직한 거예요. 다음엔 그 마음에서 딱 한 걸음만 더 가 보면 어떨까요?';
    }
    deepRows += `<div class="mm-card" style="border-color:#DCC8F2">
      <div class="mm-lb" style="color:#7B4FBF">🔒 아까 나만 봤던 답 — 속마음과 겉행동</div>
      <div class="mm-duo">
        <div class="mm-cell" style="border-color:#DCC8F2;background:#FBF8FF">
          <div class="cap" style="color:#7B4FBF">속마음</div>
          <div class="big">${io.e}</div>
          <div class="val">${io.t}</div>
        </div>
        <div class="mm-cell" style="border-color:${actColor};background:#fff">
          <div class="cap" style="color:${actColor}">겉으로 한 첫 행동</div>
          <div class="big">${goodAct?'🗣️':'🤐'}</div>
          <div class="val" style="color:${actColor}">${act}</div>
        </div>

      <div class="mm-link ${linkCls}">${linkTxt}</div>

    </div>`;
  }
  if(ex.ideal){
    const real = C1L[n][S.done[n].c1] || '';

      ? '멋지다고 생각하는 것을 실제로도 골랐어요. 진짜 교실에서도 그럴 수 있는지 — 그게 다음 연습이에요.'

      <div class="mm-lb" style="color:var(--ripple)">두 개의 질문, 두 개의 답</div>

        <div class="mm-cell" style="border-color:${near?'#A6C6F2':'#F2C480'};background:#fff">

          <div class="big">${cmp.state==='same'?'🤝':cmp.state==='dir'?'👍':'🙋'}</div>
          <div class="val">${real}</div>
        </div>
      </div>
      <div class="mm-link ${near?'same':'diff'}">${linkTxt}</div>
      <div style="font-size:15px;color:var(--paper-dim);line-height:1.7;margin-top:8px">${note}</div>
    </div>`;
  }
  if(ex.folded){
    deepRows += `<div class="mm-card" style="border-color:rgba(232,137,12,.45);background:#FFF9EC">
      <div class="mm-lb" style="color:var(--signal)">한 번 꺼냈다가, 물러선 말</div>

  const dc = doneCount();

      : '시작할 때 한 대답과 실제 선택이 조금 달라도 괜찮아요. 머리로는 “이렇게 해야지”라고 알고 있어도, 막상 그 상황이 되면 분위기나 친구들 시선 때문에 다르게 행동하게 되거든요. 누구나 그래요. 오늘 중요한 것은 딱 하나예요. 내 생각과 행동이 어디에서 달라지는지, 방금 내 눈으로 직접 확인했다는 것. 그걸 알고 나면, 다음에 비슷한 순간이 왔을 때 “아, 지금이 그 순간이구나” 하고 한 번 멈출 수 있어요. 그 멈춤에서 연습이 시작돼요.'}</p>
    <div class="spacer"></div>
    <button class="btn" id="nx">${dc>=4?'물결 지도로 — 마지막 거울이 열렸어요':'물결 지도로 돌아가기'} →</button>
  </section>`);
  show(sc);
  dicifyIn(sc, 'p');
  sc.querySelector('#nx').onclick = ()=>navHome();
}

const TYPE_FAM = {
  voice:'V', correct:'C_V', respect:'R', partner:'R', verify:'C',
  repair:'H', late:'H', expose:'P', propose:'P',
  silence:'S', silent:'S', quiet:'S', half:'S',
  join:'J', blame:'J', spread:'J', majority:'J'
};
const FIRST_FAM = { speak:'V', dm:'V', object:'V', askgroup:'R', askdm:'R', private:'R', search:'C', ask:'C' };
function computeType(){
  const sc = {V:0,R:0,C:0,H:0,P:0,S:0,J:0};
  [1,2,3,4].forEach(k=>{
    const d = S.done[k]; if(!d) return;
    let f = TYPE_FAM[d.stance];
    if(f==='C_V') f='V'; // correct(확인하고 바로잡음)는 목소리 가족
    if(f) sc[f] += 1;
    const g = FIRST_FAM[d.c1];
    if(g) sc[g] += 0.5;
  });
  const pri = ['R','V','C','H','P','S','J']; // 동점 시 우선순위
  let best = pri[0];
  pri.forEach(f=>{ if(sc[f] > sc[best]) best = f; });
  return { key:best, score:sc };
}
function subBadges(){
  const out = [];
  let over = false;
  [1,2,3,4].forEach(k=>{
    const ex = S.extra[k], d = S.done[k];
    if(ex && ex.inner && d && !AWARE_INNER.includes(ex.inner.k) && (GOOD_FIRST[k]||[]).includes(d.c1)) over = true;
  });
  if(over) out.push('⭐ 숨은 용기 — 흔들린 마음을 넘어 행동했어요');
  if([1,2,3,4].some(k=>S.extra[k] && S.extra[k].folded)) out.push('⏱ 몇 초의 기록 — 다음엔 몇 초만 더');
  if(Object.keys(S.notes).length>=4) out.push('🧩 생각 수집가 — 문장 4개를 모두 남겼어요');
  return out;
}

function roundRect_(x, xx, y, w, h, r){
  x.beginPath();
  x.moveTo(xx+r, y);
  x.arcTo(xx+w, y, xx+w, y+h, r);
  x.arcTo(xx+w, y+h, xx, y+h, r);
  x.arcTo(xx, y+h, xx, y, r);
  x.arcTo(xx, y, xx+w, y, r);
  x.closePath();
}
function wrapText_(x, text, cx, y, maxW, lh){
  const words = text.split(' ');
  let line = '', yy = y;
  words.forEach(w=>{
    const t = line ? line+' '+w : w;
    if(x.measureText(t).width > maxW && line){ x.fillText(line, cx, yy); line = w; yy += lh; }
    else line = t;
  });
  if(line) x.fillText(line, cx, yy);
  return yy;
}

          else if(aware && !goodAct){ bc='gap'; bt='△ 간격 발견'; anyGap=true; }
          rows2.push(row(k, bc, bt, '🔒 속마음', io.e+' '+io.t, '겉으로 한 첫 행동', act));
        }
        if(ex.said){
          rows2.push(row(k, 'same', '✏️ 직접 쓴 말', '내가 쓴 말', '“'+esc(ex.said.t)+'”', '앱이 읽은 길', C1L[k][ex.said.k]||ex.said.k));
        }
        if(ex.ideal){
          const c = dualCompare(k, ex.ideal.k, S.done[k].c1);
          let bc='same', bt='🤝 두 답이 똑같음';
          if(c.state==='dir'){ bt='⇉ 방법만 다른 같은 방향'; }
          else if(c.state==='diff'){ bc='gap'; bt='⇄ 방향이 다름'; anyGap=true; }
          rows2.push(row(k, bc, bt, '✨ 가장 멋진 선택', C1L[k][ex.ideal.k]||ex.ideal.x, '진짜 나의 선택', act));
        }
        if(ex.folded){
          anyGap=true;
          rows2.push(row(k, 'gap', '⏸ 몇 초의 지점', '여기까지 갔다', '말을 꺼냈다', '여기서 멈췄다', '반대에 부딪혀 물러섬'));
        }
      });
      const closing = anyOvercame && !anyGap
        ? '흔들리는 마음을 좋은 행동으로 옮긴 순간이 보여요. 이건 거리가 아니라 <b>극복</b>이에요 — 오늘 당신이 몇 번이나 해낸 일이에요.'
        : anyOvercame
        ? '어떤 곳에는 아직 거리가 있고, 어떤 곳에서는 흔들리는 마음을 좋은 행동으로 <b>넘어섰어요</b>. 거리는 좁히면 되고, 넘어선 경험은 기억하면 돼요.'
        : '이 기록들은 점수가 아니라 <b>거리</b>예요. 거리가 있다는 걸 확인한 사람만 그 거리를 줄일 수 있어요. 오늘 당신이 한 일이 바로 그거예요.';
      return rows2.length ? `<div class="law-card" style="margin-top:6px">
        <div class="art" style="color:#8A6A2F;margin-bottom:10px">한 걸음 더 들여다보기</div>
        ${rows2.join('')}
        <div class="sub" style="font-size:15px;line-height:1.8;margin-top:4px">${closing}</div></div>` : '';
    })()}
    <div class="hub-ring" style="margin-top:18px">
      <svg width="96" height="96" viewBox="0 0 96 96">${hubRingSVG()}</svg>
      <div class="hr-txt"><b>당신의 시민 나이테</b><br>네 겹이 모두 생겼어요. 색이 마음에 들지 않는 겹이 있다면 — 나이테는 계속 자라니까, 다음 겹의 색은 바꿀 수 있어요.</div>
    </div>
    <p class="serif" style="font-size:17px;margin-top:16px">민주주의는 시험 과목이 아니라 근육에 가까워요.<br>
    타고나는 게 아니라, 오늘 같은 연습으로 자라요.<br>
    그리고 그 연습장은 언제나 가까이 있어요 —<br>
    단톡방, 조별과제, 피드, 학급회의.<br>
    <strong>당신의 피부에 닿는 모든 곳에요.</strong></p>
    ${Object.keys(S.notes).length ? `<div style="margin-top:20px">
      <div class="eyebrow" style="margin-bottom:10px">네 개의 물결에 당신이 남긴 문장들</div>
      ${[1,2,3,4].filter(k=>S.notes[k]).map(k=>`<div class="note-quote">
        <div class="nq-s">${SC_META[k].title}</div>
        <div class="nq-t">“${S.notes[k].t.replace(/</g,'&lt;').replace(/>/g,'&gt;')}”</div></div>`).join('')}
      <p class="note">이 문장들은 이 기기에만 저장돼요. 서버로는 보내지 않았어요. 마음에 드는 문장이 있다면 공책에도 옮겨 적어 보세요 — 그게 진짜 수집이에요.</p>
    </div>`:''}
    <div class="law-card hl" style="margin-top:16px"><div class="art">옆 사람과 3분</div>
      <div class="sub" style="margin-top:4px">① 네 상황 중 가장 손가락이 오래 멈췄던 순간은 어디였나요? 왜였을까요?<br>② ‘말한 나’와 ‘선택한 나’의 간격이 가장 컸던 곳은 어디였나요?<br>③ 내일 우리 반에서 이것과 가장 비슷하게 일어날 수 있는 일은 뭘까요?</div></div>
    <div class="spacer"></div>
    <button class="btn" id="re">물결 지도로 — 다른 길도 걸어 보기</button>
    <p class="note">같은 상황을 다시 하면 다른 선택의 물결과 다른 유형을 볼 수 있어요. 기록은 처음 한 번만 집계돼요.</p>
  </section>`);
  show(sc);
  dicifyIn(sc, 'p, .gm-sum');
  sc.querySelector('#mkcard').onclick = ()=>{
    try{ showCardOverlay(makeResultCard()); }catch(e){}
  };
  sc.querySelector('#re').onclick = ()=>navHome();
}

/* ══════════ 10. 교사용 대시보드 ══════════ */
function scrTeacher(){
  const sc = el(`<section class="screen night noback">
    <div class="eyebrow">너라면 어떻게 할래? · 교사용</div>
    <h2>우리 반 물결 지도<br>수업 대시보드</h2>
    <p class="note">학생 화면과 별개입니다. 이 페이지 주소 뒤에 <b>?mode=teacher</b>를 붙이면 언제든 들어올 수 있어요. 모든 수치는 익명 집계입니다. 보호자 안내 화면은 <b>?mode=guide</b>입니다.</p>
    <div id="body"><p class="note">집계를 불러오는 중…</p></div>
    <div class="law-card" style="margin-top:20px"><div class="art">권장 수업 흐름 (시나리오당 30~40분)</div>
      <div class="sub">① 각자 체험(10분) → ② 분포 화면 함께 보기 — “왜 침묵이 많을까?”(5분) → ③ 아래 발문으로 토론(15분) → ④ 헌법 렌즈 함께 읽기(5분) → ⑤ 원하는 학생은 다른 길로 재체험(과제)</div></div>
    <div class="law-card" style="margin-top:10px"><div class="art">공통 토론 발문</div>
      <div class="sub">· 침묵을 고른 사람들은 나쁜 사람들일까? 아니라면 무엇이 그들을 조용하게 만들까?<br>· ‘분위기’는 누가 만드는 걸까? 분위기에도 책임이 있을까?<br>· 옳은 선택의 비용(놀림, 어색함, 손해)은 누가 낮춰 줄 수 있을까?<br>· 네 상황의 공통점은 무엇일까? (판정/공유/결정 전에 ‘묻기’가 빠져 있었다는 점)</div></div>
    <div class="law-card" style="margin-top:10px"><div class="art">유의 사항</div>
      <div class="sub">· 학생의 유형·걸은 길을 평가나 훈계의 근거로 쓰지 말아 주세요. 솔직함이 이 활동의 재료입니다.<br>· 재체험을 해도 통계는 학생당 처음 한 번만 집계됩니다.</div></div>
  </section>`);
  show(sc);
  fetchStats(stats=>{
    const body = sc.querySelector('#body'); body.innerHTML='';
    [1,2,3,4].forEach(n=>{
      const st = stats && stats[String(n)];
      const sec = el(`<div style="margin-bottom:26px">
        <h3 style="font-family:var(--serif);font-size:18px;margin-bottom:10px">${SC_META[n].no} · ${SC_META[n].title} <span class="note" style="display:inline">${st?`— ${st.total}명 참여`:'— 아직 기록 없음'}</span></h3>
        <div class="bars"></div></div>`);
      const data = st && st.total>0 ? st.c1 : DEMO[n];
      const total = Object.values(data).reduce((a,b)=>a+b,0)||1;
      Object.keys(C1L[n]).forEach((k,i)=>{
        const v=data[k]||0, pct=Math.round(v/total*100);
        sec.querySelector('.bars').appendChild(el(`<div>
          <div class="bar-label"><span>${C1L[n][k]}</span><span>${st?`${v}명 · `:''}${pct}%</span></div>
          <div class="bar-track"><span class="bar-fill" style="width:${Math.max(pct,3)}%;background:${['#D98E5F','#8A94A6','#6FA8FF','#7FB59B'][i]}"></span></div></div>`));
      });
      if(!st || st.total===0) sec.appendChild(el(`<p class="note">위 수치는 예시 분포입니다. 학생 기록이 쌓이면 실제 수치로 바뀝니다.</p>`));
      body.appendChild(sec);
    });
  });
}

/* ══════════ 시작 ══════════ */
(function boot(){
  const mode = new URLSearchParams(location.search).get('mode');
  if(mode==='teacher'){ NAV=[{fn:scrTeacher,a:[]}]; scrTeacher(); return; }
  if(mode==='guide'){ NAV=[{fn:scrGuide,a:[]}]; scrGuide(); return; }
  NAV=[{fn:scrIntro,a:[]}];
  scrIntro();
  let seen = true;
  try{ seen = !!localStorage.getItem('pinu_onb'); }catch(e){}
  if(!seen) showOnb(true);
})();
</script>
