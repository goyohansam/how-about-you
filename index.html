<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>너라면 어떻게 할래? — 피부에 닿는 민주주의</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>

/* ─────────────────────────────────────────────
   토큰: 두 개의 세계
────────────────────────────────────────────── */
:root{
  --ink:#FFF7EA;         /* 낮 — 밝은 크림색 배경 */
  --ink-2:#FFFFFF;       /* 카드 */
  --paper:#3B3630;       /* 본문 글자 */
  --paper-dim:#6F675B;   /* 흐린 글자 */
  --ripple:#3D7BF5;      /* 물결 파랑 */
  --signal:#E8890C;      /* 선택의 순간 주황 */
  --ember:#E4573D;       /* 비용·결과 */
  --sprout:#2E9E74;      /* 나이테·성장 초록 */
  --chat-bg:#E9EDF3;     /* 소셜 세계 */
  --chat-mine:#2E6BE6;
  --chat-ink:#232B38;
  --serif:'Gowun Batang','Nanum Myeongjo',serif;
  --sans:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--ink);
  font-family:var(--sans);
  color:var(--paper);
  display:flex;justify-content:center;
  min-height:100dvh;
}
#app{
  width:100%;max-width:480px;min-height:100dvh;
  position:relative;overflow-x:hidden;
  background:var(--ink);
  display:flex;flex-direction:column;
}
@media(min-width:560px){
  body{align-items:center;padding:24px 0;
    background:
      radial-gradient(700px 420px at 10% -5%, #FFE3C2 0%, transparent 60%),
      radial-gradient(700px 460px at 95% 5%, #DCEBFF 0%, transparent 60%),
      radial-gradient(800px 520px at 50% 108%, #DDF2E4 0%, transparent 55%),
      #FFF3E0;}
  #app{min-height:min(860px,94dvh);height:min(860px,94dvh);border-radius:28px;
    box-shadow:0 22px 56px rgba(140,100,40,.22);overflow:hidden}
}

/* 화면 전환 */
.screen{display:none;flex:1;flex-direction:column;animation:fadeIn .5s ease;position:relative}
.screen.on{display:flex}
@media(min-width:560px){.screen{overflow-y:auto}.chatworld{overflow:hidden;height:auto;max-height:none}}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}

/* ── 성찰 세계 공통 ── */
.night{padding:30px 26px 40px;flex:1;display:flex;flex-direction:column}
.night::before{content:'';flex:none;height:9px;border-radius:99px;margin-bottom:20px;
  background:linear-gradient(90deg,#FF9F68,#FFD166,#63C89B,#5D9BFF,#C792EA)}
.night h1,.night h2,.night .serif{font-family:var(--serif)}
.eyebrow{font-size:13px;letter-spacing:.24em;color:var(--ripple);
  text-transform:uppercase;margin-bottom:14px;font-weight:600}
.night h1{font-size:37px;line-height:1.3;font-weight:700;margin-bottom:8px}
.night h2{font-size:26px;line-height:1.45;font-weight:700;margin-bottom:16px}
.night p{font-size:17px;line-height:1.85;color:var(--paper-dim);margin-bottom:14px}
.night p strong{color:var(--paper);font-weight:600}
.night p.serif{font-family:var(--serif);color:var(--paper);font-size:18.5px}
.spacer{flex:1}
.btn{
  font-family:var(--sans);font-size:17.5px;font-weight:700;
  background:var(--paper);color:var(--ink);border:none;border-radius:14px;
  padding:16px 20px;width:100%;cursor:pointer;margin-top:10px;
  transition:transform .15s ease,opacity .15s;
}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--paper-dim);
  border:1px solid rgba(59,54,48,.25);font-weight:500}
.btn:focus-visible,.opt:focus-visible,.dot:focus-visible{
  outline:3px solid var(--signal);outline-offset:2px}
.note{font-size:14px;color:var(--paper-dim);opacity:.75;line-height:1.7;margin-top:14px}

/* ── 자가진단 ── */
.q-card{background:#fff;border:1.5px solid #E8EDF8;box-shadow:0 3px 10px rgba(100,120,180,.07);
  border-radius:18px;padding:22px 20px;margin-bottom:14px}
.q-card .q{font-family:var(--serif);font-size:18.5px;line-height:1.6;margin-bottom:18px;color:var(--paper)}
.dots{display:flex;justify-content:space-between;align-items:center;gap:6px}
.dot{width:40px;height:40px;border-radius:50%;border:2px solid rgba(59,54,48,.3);
  background:transparent;cursor:pointer;flex-shrink:0;transition:.15s}
.dot.sel{background:var(--ripple);border-color:var(--ripple)}
.dots-label{display:flex;justify-content:space-between;font-size:13px;
  color:var(--paper-dim);margin-top:8px}

/* ── 소셜 세계: 단톡방 ── */
.chatworld{background:var(--chat-bg);color:var(--chat-ink);flex:1;
  height:100dvh;max-height:100dvh;overflow:hidden;
  display:flex;flex-direction:column}
.chat-top{background:#F7F9FC;border-bottom:1px solid #D8DEE8;
  padding:14px 18px;display:flex;align-items:center;gap:10px;
  position:sticky;top:0;z-index:5}
.chat-top .room{font-weight:700;font-size:15.5px}
.chat-top .cnt{color:#8A94A6;font-size:13.5px}
.chat-top .live{margin-left:auto;font-size:11px;color:#8A94A6}
.chat-scroll{flex:1;overflow-y:auto;padding:18px 14px 130px;
  display:flex;flex-direction:column;gap:4px}
.msg{display:flex;gap:9px;margin-top:12px;animation:msgIn .35s ease}
@keyframes msgIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.avatar{width:38px;height:38px;border-radius:14px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:17px;background:#CDD6E4}
.msg .body{max-width:76%}
.msg .name{font-size:12px;color:#69748A;margin-bottom:4px}
.bubble{background:#fff;border-radius:4px 16px 16px 16px;padding:10px 13px;
  font-size:16.5px;line-height:1.55;box-shadow:0 1px 2px rgba(20,30,50,.07);
  width:fit-content;max-width:100%;word-break:keep-all}
.msg+.msg.same{margin-top:3px}
.msg.same .avatar{visibility:hidden;height:0}
.msg.same .name{display:none}
.msg.mine{flex-direction:row-reverse}
.msg.mine .avatar,.msg.mine .name{display:none}
.msg.mine .bubble{background:var(--chat-mine);color:#fff;
  border-radius:16px 4px 16px 16px;margin-left:auto}
.sysline{text-align:center;font-size:13.5px;color:#8A94A6;margin:16px 0 4px}
.typing .bubble{color:#8A94A6;letter-spacing:2px}
/* 밈 카드 (가상의 혐오 밈) */
.meme{background:#fff;border-radius:4px 16px 16px 16px;overflow:hidden;
  box-shadow:0 1px 3px rgba(20,30,50,.12);width:230px}
.meme .m-head{background:#39415A;color:#fff;font-weight:800;font-size:14.5px;
  padding:10px 14px;font-style:italic}
.meme ul{list-style:none;padding:12px 14px;font-size:13.5px;line-height:1.5}
.meme li{padding:4px 0;border-bottom:1px dashed #E3E7EF}
.meme li:last-child{border:none}
.meme .m-foot{font-size:10.5px;color:#9AA3B5;padding:0 14px 10px}
/* 내레이터 */
.narr{align-self:center;max-width:88%;text-align:center;margin:20px 0 6px;
  font-family:var(--serif);font-size:15.5px;line-height:1.8;color:#4A5568;
  background:rgba(255,255,255,.55);border:1px solid #D8DEE8;
  border-radius:14px;padding:12px 16px;animation:msgIn .5s ease}
/* 선택지 패널 */
.choice-panel{position:absolute;left:0;right:0;bottom:0;z-index:8;
  background:linear-gradient(to top,var(--ink) 78%,transparent);
  padding:44px 16px 18px;transform:translateY(105%);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.choice-panel.up{transform:none}
.choice-panel .cp-title{font-family:var(--serif);color:var(--signal);
  font-size:16px;margin-bottom:12px;text-align:center;letter-spacing:.02em}
.opt{display:block;width:100%;text-align:left;background:#fff;box-shadow:0 2px 7px rgba(140,100,40,.09);
  color:var(--paper);border:1px solid rgba(59,54,48,.16);border-radius:13px;
  padding:15px 17px;font-size:16.5px;line-height:1.55;font-family:var(--sans);
  cursor:pointer;margin-bottom:9px;transition:.15s}
.opt:hover{border-color:var(--signal)}
.opt:active{transform:scale(.985)}
.opt .tag{display:block;font-size:13.5px;color:var(--paper-dim);margin-top:3px}

/* ── 물결 지도 ── */
.ripple-wrap{display:flex;flex-direction:column;flex:1;padding:28px 22px 34px}
.ripple-svg{width:100%;max-width:360px;margin:6px auto 4px;display:block}
.ring-c{fill:none;stroke:rgba(111,168,255,.28);stroke-width:1.4}
.ring-c.hot{stroke:var(--ripple);stroke-width:2.4;
  filter:drop-shadow(0 0 8px rgba(111,168,255,.7))}
.ring-lb{font-family:var(--sans);font-size:12.5px;fill:var(--paper-dim);letter-spacing:.06em}
.ring-lb.hot{fill:var(--paper);font-weight:700}
.pulse{fill:var(--signal);animation:pulse 2.4s ease-out infinite;transform-origin:center}
@keyframes pulse{0%{opacity:.9;r:5}70%{opacity:0;r:26}100%{opacity:0;r:26}}
.timeline{display:flex;gap:6px;justify-content:center;margin:14px 0 10px;flex-wrap:wrap}
.t-step{font-size:13.5px;padding:7px 12px;border-radius:999px;cursor:pointer;
  border:1px solid rgba(59,54,48,.2);color:var(--paper-dim);background:#fff;
  font-family:var(--sans);transition:.15s;position:relative}
.t-step:hover{border-color:var(--ripple);color:var(--ripple)}
.t-step.seen{border-color:rgba(111,168,255,.55);color:var(--ripple)}
.t-step.seen::after{content:'✓';font-size:11px;margin-left:5px;color:var(--sprout);font-weight:900}
.t-step.on{background:var(--ripple);border-color:var(--ripple);color:#fff;font-weight:700}
.t-step.on::after{color:#fff}
.t-step:focus-visible{outline:3px solid var(--signal);outline-offset:2px}
.t-hint{text-align:center;font-size:13px;color:var(--paper-dim);opacity:.8;margin:0 0 12px}
.ripple-text{background:var(--ink-2);border-radius:16px;padding:20px 19px;min-height:150px;
  border:1px solid rgba(111,168,255,.15)}
.ripple-text .rt-when{font-size:12px;letter-spacing:.18em;color:var(--ripple);
  font-weight:700;margin-bottom:10px}
.ripple-text .rt-body{font-family:var(--serif);font-size:17.5px;line-height:1.85;color:var(--paper)}
.rt-nav{display:flex;gap:8px;margin-top:14px}
.rt-nav button{flex:1;font-family:var(--sans);font-size:14.5px;font-weight:700;cursor:pointer;
  border-radius:11px;padding:11px;border:1.5px solid rgba(59,54,48,.18);background:#fff;color:var(--paper)}
.rt-nav button:disabled{opacity:.35;cursor:default}
.rt-nav button.prev{color:var(--paper-dim)}

/* ── 데이터 공개 ── */
.bar-row{margin-bottom:16px}
.bar-row .b-label{display:flex;justify-content:space-between;font-size:15.5px;margin-bottom:6px}
.bar-row .b-label .pct{font-weight:800;color:var(--paper)}
.bar{height:14px;background:rgba(59,54,48,.1);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ripple);border-radius:999px;
  width:0;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.bar-row.me .b-label .pct{color:var(--signal)}
.bar-row.me .bar i{background:var(--signal)}
.mine-flag{font-size:11px;color:var(--signal);font-weight:700;margin-left:6px}
.src{font-size:11.5px;color:var(--paper-dim);opacity:.7;margin-top:6px}

/* ── 헌법 렌즈 ── */
.law-card{background:#FFFFFF;color:#3B3630;border:1.5px solid #F2E3C6;box-shadow:0 3px 10px rgba(150,110,40,.08);border-radius:18px;
  padding:22px 20px;margin-bottom:14px;position:relative}
.law-card .art{font-size:13px;letter-spacing:.2em;font-weight:800;
  color:#8A6A2F;margin-bottom:10px}
.law-card .txt{font-family:var(--serif);font-size:18px;line-height:1.8;font-weight:700}
.law-card .sub{font-size:15px;color:#5A5648;margin-top:10px;line-height:1.7}
.vs{ text-align:center;font-family:var(--serif);color:var(--signal);
  font-size:15px;margin:4px 0 14px}
textarea.think{width:100%;background:var(--ink-2);border:1px solid rgba(111,168,255,.25);
  border-radius:13px;color:var(--paper);font-family:var(--serif);font-size:15px;
  line-height:1.7;padding:14px;min-height:92px;resize:vertical}
textarea.think::placeholder{color:rgba(59,54,48,.35)}

/* ── 거울 ── */
.mirror-row{background:var(--ink-2);border-radius:16px;padding:18px;margin-bottom:12px;
  border-left:3px solid var(--ripple)}
.mirror-row.gap{border-left-color:var(--ember)}
.mirror-row .said{font-size:14.5px;color:var(--paper-dim);margin-bottom:6px}
.mirror-row .said b{color:var(--paper)}
.mirror-row .did{font-family:var(--serif);font-size:17px;line-height:1.7}
.mirror-row .did em{font-style:normal;color:var(--signal)}

/* ── 나이테 ── */
.ring-svg{display:block;margin:10px auto}
.talk-card{background:linear-gradient(135deg,#E1F3E9,#EFFAF3);border:1.5px solid rgba(46,158,116,.35);
  border-radius:18px;padding:22px 20px;margin-top:16px}
.talk-card .tc-title{font-size:12px;letter-spacing:.2em;color:var(--sprout);
  font-weight:800;margin-bottom:10px}
.talk-card p{color:var(--paper);font-family:var(--serif);font-size:17.5px;line-height:1.8;margin:0}

/* ── 교사용 ── */
.tstat{background:var(--ink-2);border-radius:14px;padding:16px 18px;margin-bottom:10px;
  display:flex;justify-content:space-between;font-size:16px}
.tstat b{color:var(--signal)}
.tq{background:var(--ink-2);border-left:3px solid var(--sprout);border-radius:12px;
  padding:14px 16px;margin-bottom:10px;font-family:var(--serif);
  font-size:16.5px;line-height:1.7}

/* 진행 점 */
.crumbs{display:flex;gap:5px;justify-content:center;padding:14px 0 0}
.crumbs i{width:6px;height:6px;border-radius:50%;background:rgba(59,54,48,.18)}
.crumbs i.on{background:var(--ripple)}
/* ── 홈 허브 ── */
.sc-card{display:block;width:100%;text-align:left;background:var(--ink-2);
  border:1px solid rgba(111,168,255,.15);border-radius:18px;padding:18px;
  margin-bottom:12px;cursor:pointer;color:var(--paper);font-family:var(--sans);transition:.15s}
.sc-card:hover{border-color:var(--ripple)}
.sc-card .sc-no{font-size:12px;letter-spacing:.2em;color:var(--ripple);font-weight:800}
.sc-card .sc-title{font-family:var(--serif);font-size:21px;font-weight:700;margin:6px 0 4px}
.sc-card .sc-tag{font-size:14.5px;color:var(--paper-dim);line-height:1.6}
.sc-card .sc-done{display:inline-block;margin-top:10px;font-size:13.5px;font-weight:700;
  padding:5px 11px;border-radius:999px;background:rgba(46,158,116,.13);color:var(--sprout)}
.sc-card.locked{opacity:.9}
.hub-ring{display:flex;align-items:center;gap:16px;background:var(--ink-2);
  border-radius:18px;padding:16px 18px;margin-bottom:14px;border:1px solid rgba(59,54,48,.1)}
.hub-ring .hr-txt{font-size:14.5px;color:var(--paper-dim);line-height:1.7}
.hub-ring .hr-txt b{color:var(--paper)}
.law-chip{display:inline-block;font-size:12px;font-weight:700;background:rgba(242,169,59,.13);
  color:var(--signal);border:1px solid rgba(242,169,59,.35);border-radius:999px;
  padding:5px 11px;margin:0 6px 6px 0}
/* ── 피드 시뮬레이션 ── */
.feed-round{font-size:12px;letter-spacing:.18em;color:var(--ripple);font-weight:700;
  text-align:center;margin-bottom:12px}
.thumb{display:block;width:100%;text-align:left;border:none;border-radius:16px;
  padding:16px;margin-bottom:12px;cursor:pointer;font-family:var(--sans);transition:.15s}
.thumb:active{transform:scale(.98)}
.thumb .th-badge{font-size:11px;font-weight:800;letter-spacing:.06em;
  display:inline-block;padding:3px 9px;border-radius:6px;margin-bottom:8px}
.thumb .th-title{font-size:17.5px;font-weight:700;line-height:1.5}
.thumb .th-meta{font-size:12px;margin-top:8px;opacity:.75}
.thumb.hot{background:#FFE3DB;color:#8A2B1B;border:1px solid rgba(228,87,61,.45)}
.thumb.hot .th-badge{background:var(--ember);color:#fff}
.thumb.calm{background:#DFEAFB;color:#1F3B66;border:1px solid rgba(61,123,245,.4)}
.thumb.calm .th-badge{background:var(--ripple);color:#fff}
.feed-cols{display:flex;gap:10px;margin:14px 0}
.feed-col{flex:1;background:var(--ink-2);border-radius:14px;padding:12px;
  border:1px solid rgba(59,54,48,.12)}
.feed-col .fc-head{font-size:13.5px;font-weight:800;margin-bottom:10px;text-align:center;
  color:var(--paper)}
.feed-col .fc-item{font-size:13px;line-height:1.5;padding:8px 9px;border-radius:9px;
  margin-bottom:7px;background:rgba(0,0,0,.04);color:var(--paper-dim)}
.feed-col .fc-item.hot{background:rgba(228,87,61,.13);color:#B23A26}
/* ── 투표 ── */
.poll{background:#fff;border-radius:4px 16px 16px 16px;box-shadow:0 1px 3px rgba(20,30,50,.12);
  width:250px;padding:14px}
.poll .p-q{font-weight:800;font-size:14.5px;margin-bottom:10px}
.poll .p-opt{display:block;width:100%;text-align:left;background:#F0F3F8;border:1px solid #D8DEE8;
  border-radius:10px;padding:10px 12px;font-size:13.5px;margin-bottom:7px;cursor:pointer;font-family:var(--sans)}
.poll .p-opt:hover{border-color:var(--chat-mine)}
.poll .p-res{margin-bottom:8px}
.poll .p-res .pr-l{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:3px}
.poll .p-res .pr-b{height:9px;background:#EDF0F5;border-radius:99px;overflow:hidden}
.poll .p-res .pr-b i{display:block;height:100%;background:var(--chat-mine);border-radius:99px}
.poll .p-res.win .pr-b i{background:var(--ember)}
/* ── 헌법 강조 카드 ── */
.law-card.hl{background:#FFF4D8;color:var(--paper);border:1.5px solid rgba(232,137,12,.45)}
.law-card.hl .art{color:var(--signal)}
.law-card.hl .txt{color:var(--paper)}
.law-card.hl .sub{color:var(--paper-dim)}
/* 파일 첨부 말풍선 */
.filebub{display:flex;align-items:center;gap:9px;background:#fff;border-radius:4px 16px 16px 16px;
  padding:11px 13px;box-shadow:0 1px 2px rgba(20,30,50,.07);font-size:13.5px;width:fit-content}
.filebub .f-ic{width:34px;height:34px;border-radius:9px;background:#EEF1F6;
  display:flex;align-items:center;justify-content:center;font-size:16px}
.filebub .f-sub{font-size:11px;color:#8A94A6}
/* 영상 카드 말풍선 */
.vidbub{width:240px;background:#fff;border-radius:4px 16px 16px 16px;overflow:hidden;
  box-shadow:0 1px 3px rgba(20,30,50,.12)}
.vidbub .v-thumb{background:#20242E;color:#FF6B57;font-weight:800;font-size:14px;
  padding:26px 14px;text-align:center;line-height:1.5;position:relative}
.vidbub .v-thumb::after{content:'▶';position:absolute;right:10px;bottom:8px;
  color:rgba(255,255,255,.85);font-size:18px}
.vidbub .v-meta{font-size:11px;color:#8A94A6;padding:9px 12px}
.vidbub .v-cmt{border-top:1px solid #EDF0F5;padding:8px 12px;font-size:11.5px;color:#4A5568;line-height:1.5}

/* ── 보완 스타일 ── */
.q-open{margin-top:20px}
.q-open .qo-t{font-family:var(--serif);font-size:17.5px;line-height:1.7;
  color:var(--signal);margin-bottom:12px}
.q-open textarea{width:100%;box-sizing:border-box;background:var(--ink-2);
  border:1px solid rgba(111,168,255,.3);border-radius:13px;color:var(--paper);
  font-family:var(--serif);font-size:16.5px;line-height:1.7;padding:14px;
  min-height:130px;resize:vertical;display:block}
.q-open textarea::placeholder{color:rgba(59,54,48,.35)}
.sc-card.done{background:linear-gradient(135deg,#E1F3E9,#F2FBF6)!important;
  border-color:rgba(46,158,116,.55)!important}
.sc-card.done .sc-no{color:var(--sprout)}
.sc-card.done .sc-title::after{content:' ✓';color:var(--sprout)}
.cmp{background:var(--ink-2);border-radius:16px;padding:16px 16px 14px;margin-bottom:12px;
  border:1px solid rgba(59,54,48,.08)}
.cmp .c-q{font-size:15.5px;color:var(--paper);font-family:var(--serif);
  margin-bottom:12px;line-height:1.6}
.cmp .c-grid{display:grid;grid-template-columns:1fr 22px 1fr;gap:6px;align-items:center}
.cmp .c-cap{font-size:12px;letter-spacing:.12em;color:var(--paper-dim);
  font-weight:800;margin-bottom:7px}
.cmp .c-dots{display:flex;gap:4px;margin-bottom:5px}
.cmp .c-dots i{width:13px;height:13px;border-radius:50%;background:rgba(59,54,48,.13)}
.cmp .c-dots i.on{background:var(--ripple)}
.cmp .c-sub{font-size:13px;color:var(--paper-dim)}
.cmp .c-arrow{color:var(--paper-dim);font-size:15px;text-align:center}
.cmp .c-chip{display:inline-block;font-size:14px;font-weight:700;line-height:1.4;
  padding:8px 12px;border-radius:12px;background:rgba(0,0,0,.035);
  border:1.5px solid currentColor}
.cmp .c-tag{margin-top:11px;font-size:13.5px;font-weight:700;padding-top:9px;
  border-top:1px dashed rgba(59,54,48,.12)}
.cmp .c-tag.ok{color:var(--sprout)} .cmp .c-tag.gap{color:var(--signal)}

/* ── 헌법 렌즈 배지 ── */
.chip-shelf{display:flex;flex-wrap:wrap;gap:8px 16px;margin:4px 0 14px}
.chip-badge{display:flex;flex-direction:column;align-items:center;gap:1px}
.chip-badge span{font-size:12px;font-weight:800;color:var(--paper-dim);letter-spacing:.02em}
.chip-badge.new{animation:chipPop .7s cubic-bezier(.2,1.5,.4,1)}
@keyframes chipPop{from{transform:scale(.2) rotate(-14deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}

/* ── 와플 차트(25명 교실) ── */
.waffle{display:grid;grid-template-columns:repeat(5,34px);gap:8px;justify-content:center;margin:16px auto 8px}
.waffle i{width:34px;height:34px;border-radius:11px 11px 13px 13px;position:relative;
  transform:scale(0);animation:seatIn .32s forwards}
@keyframes seatIn{60%{transform:scale(1.15)}100%{transform:scale(1)}}
.waffle i::after{content:'◡';position:absolute;inset:0;display:flex;align-items:center;
  justify-content:center;font-size:13px;color:rgba(16,26,46,.5);font-weight:900}
.waffle i.me{box-shadow:0 0 0 2.5px #fff,0 0 0 5px var(--signal)}
.waffle i.me::after{content:'나';font-size:12px;color:#101A2E}
.legend-row{display:flex;align-items:center;gap:10px;font-size:15px;margin:8px 0;
  padding:2px 4px}
.legend-row .sw{width:17px;height:17px;border-radius:6px;flex-shrink:0}
.legend-row .pc{margin-left:auto;font-weight:800;font-variant-numeric:tabular-nums}
.legend-row.mine{outline:1.5px solid var(--signal);outline-offset:4px;border-radius:7px}
/* ── 헌법 빈칸 퀴즈 ── */
.law-card{position:relative}
.blank{display:inline-block;min-width:60px;border-bottom:2.5px dashed currentColor;
  text-align:center;font-weight:800}
.blank.filled{border-bottom-color:transparent;animation:fillPop .5s}
@keyframes fillPop{from{transform:scale(.5)}60%{transform:scale(1.25)}to{transform:scale(1)}}
.quiz{display:flex;gap:8px;margin-top:13px;flex-wrap:wrap}
.quiz .q-hint{width:100%;font-size:13px;opacity:.6}
.qchip{border:1.5px solid;border-radius:999px;padding:7px 15px;font-weight:800;
  font-size:15px;background:transparent;cursor:pointer;font-family:var(--sans);transition:.15s}
.qchip:hover{transform:translateY(-1px)}
.qchip.no{animation:shake .4s;opacity:.3;pointer-events:none}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.won-mark{position:absolute;top:14px;right:16px;font-size:15px;font-weight:900;
  animation:fillPop .5s}
/* ── 생각 조각 ── */
.think-save{margin-top:10px;width:100%;background:#F2FBF6;border:1.5px dashed rgba(46,158,116,.55);
  color:var(--sprout);border-radius:12px;padding:12px;font-family:var(--sans);
  font-weight:800;font-size:15.5px;cursor:pointer}
.think-save:hover{background:rgba(46,158,116,.1)}
.think-fb{background:linear-gradient(135deg,#E1F3E9,#F0FAF4);border:1.5px solid rgba(46,158,116,.4);
  border-radius:14px;padding:14px 16px;margin-top:10px;font-size:15px;line-height:1.75;
  animation:msgIn .5s ease}
.think-fb .fb-badge{display:inline-block;font-weight:900;color:var(--sprout);
  margin-bottom:6px;animation:fillPop .6s}
.note-quote{background:var(--ink-2);border-left:3px solid var(--sprout);border-radius:12px;
  padding:13px 15px;margin-bottom:10px}
.note-quote .nq-s{font-size:11px;letter-spacing:.1em;color:var(--sprout);font-weight:800;margin-bottom:5px}
.note-quote .nq-t{font-family:var(--serif);font-size:16px;line-height:1.7}

/* ── 홈 카드 4색 ── */
#cards .sc-card:nth-of-type(1){background:#FFF0DB;border:1.5px solid #F3C689}
#cards .sc-card:nth-of-type(2){background:#EAF3FF;border:1.5px solid #A6C6F2}
#cards .sc-card:nth-of-type(3){background:#F7ECFB;border:1.5px solid #D9AEEE}
#cards .sc-card:nth-of-type(4){background:#FFF8D9;border:1.5px solid #E5CE72}

/* ── 속마음 스냅샷(비공개) ── */
.inner-badge{align-items:center;gap:6px;font-size:13.5px;font-weight:800;
  color:#7B4FBF;background:#F3EBFC;border:1.5px solid #DCC8F2;border-radius:999px;
  padding:6px 13px;margin:0 auto 10px;justify-content:center;display:flex;width:fit-content}
.opt.inner{background:#FBF8FF;border-color:#DCC8F2}
.opt.inner:hover{border-color:#9A6FD0}

/* ── 이중 질문(멋진 나/진짜 나) ── */
.dual-step{font-size:13.5px;font-weight:800;letter-spacing:.06em;text-align:center;
  color:var(--ripple);margin-bottom:5px}
.dual-step.real{color:var(--signal)}

/* ── 추정 슬라이더 ── */
.gauge-num{font-size:44px;font-weight:900;color:var(--signal);text-align:center;
  font-variant-numeric:tabular-nums;line-height:1.1}
.gauge-sub{text-align:center;font-size:14.5px;color:var(--paper-dim);margin:2px 0 6px}
input[type=range].gauge{width:100%;accent-color:var(--signal);height:36px;cursor:pointer}

/* ── 진짜처럼 생긴 채팅 입력바 ── */
.fakebar{display:flex;gap:8px;align-items:center}
.fk-emoji{font-size:16px;font-weight:800;background:#FFE9C9;border:1.5px solid #F2C480;
  border-radius:999px;padding:12px 15px;cursor:pointer;font-family:var(--sans);flex-shrink:0}
.fk-input{flex:1;background:#fff;border:1.5px solid #D8DEE8;border-radius:999px;
  padding:13px 17px;font-size:15.5px;color:#8A94A6;text-align:left;cursor:text;font-family:var(--sans)}
.fk-pass{font-size:13.5px;color:#69748A;background:#EDF0F5;border:none;border-radius:999px;
  cursor:pointer;font-family:var(--sans);padding:12px 13px;flex-shrink:0;font-weight:700}

/* ── 작은 거울: 시각화 카드 ── */
.mm-card{background:#fff;border:1.5px solid #E8E2D6;border-radius:16px;
  padding:18px 17px 15px;margin-bottom:12px;box-shadow:0 3px 10px rgba(140,110,60,.07)}
.mm-q{font-family:var(--serif);font-size:16.5px;line-height:1.55;margin-bottom:14px}
.mm-lb{font-size:13px;font-weight:800;letter-spacing:.08em;color:var(--paper-dim);margin-bottom:7px}
.mm-dots{display:flex;align-items:center;gap:7px}
.mm-dots i{width:26px;height:26px;border-radius:50%;border:2px solid rgba(59,54,48,.25);flex-shrink:0}
.mm-dots i.on{background:var(--ripple);border-color:var(--ripple)}
.mm-dots .mm-score{margin-left:6px;font-size:15px;font-weight:800;color:var(--ripple)}
.mm-scale{display:flex;justify-content:space-between;font-size:12.5px;color:var(--paper-dim);
  margin-top:5px;max-width:158px}
.mm-arrow{text-align:center;color:var(--paper-dim);font-size:17px;margin:9px 0}
.mm-chip{display:inline-block;font-size:16px;font-weight:800;line-height:1.4;
  padding:9px 15px;border-radius:999px;border:2px solid currentColor;background:#fff}
.mm-tag{margin-top:13px;padding-top:11px;border-top:1.5px dashed #E8E2D6;
  font-size:15px;font-weight:800;display:flex;align-items:center;gap:7px}
.mm-tag.ok{color:var(--sprout)} .mm-tag.gap{color:var(--signal)}
.mm-duo{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:4px}
.mm-cell{border-radius:13px;padding:13px 11px;text-align:center;border:1.5px solid}
.mm-cell .cap{font-size:12.5px;font-weight:800;letter-spacing:.06em;margin-bottom:7px;opacity:.75}
.mm-cell .big{font-size:26px;line-height:1.2;margin-bottom:5px}
.mm-cell .val{font-size:15px;font-weight:700;line-height:1.45;word-break:keep-all}
.mm-link{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:11px;
  font-size:15px;font-weight:800}
.mm-link.same{color:var(--sprout)} .mm-link.diff{color:var(--signal)}
.mm-steps{display:flex;align-items:flex-start;margin-top:8px}
.mm-step{flex:1;text-align:center;position:relative}
.mm-step .nd{width:22px;height:22px;border-radius:50%;margin:0 auto 7px;
  border:2.5px solid var(--sprout);background:var(--sprout);position:relative;z-index:2}
.mm-step.stop .nd{background:#fff;border-color:var(--signal)}
.mm-step .tx{font-size:13.5px;line-height:1.45;color:var(--paper);font-weight:700;word-break:keep-all}
.mm-step.stop .tx{color:var(--signal)}
.mm-step::before{content:'';position:absolute;top:10px;left:-50%;width:100%;height:2.5px;background:var(--sprout)}
.mm-step:first-child::before{display:none}
.mm-step.stop::before{background:repeating-linear-gradient(90deg,var(--signal) 0 6px,transparent 6px 12px)}

/* ── 내 말로 직접 쓰기 ── */
.free-toggle{border-style:dashed !important}
.free-box textarea{width:100%;box-sizing:border-box;font-family:var(--sans);font-size:17px;
  padding:12px 14px;border:1.5px solid rgba(59,54,48,.28);border-radius:12px;background:#fff;
  resize:none;margin-bottom:8px;line-height:1.5}
.free-box textarea:focus{outline:2.5px solid var(--ripple);border-color:transparent}

/* ── 한 걸음 더: 시각 행 ── */
.deep-row{border:1.5px solid #EDE5D8;border-radius:14px;padding:12px 12px 11px;margin-bottom:10px;background:#fff}
.deep-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:9px;flex-wrap:wrap}
.deep-sc{font-size:14px;font-weight:800;color:var(--paper-dim)}
.deep-badge{font-size:13.5px;font-weight:800;padding:5px 12px;border-radius:999px;white-space:nowrap}
.deep-badge.over{background:#E7F3ED;color:#2E9E74}
.deep-badge.gap{background:#FDEFDA;color:#C97207}
.deep-badge.same{background:#EFF3F7;color:#5A6B7E}
.deep-duo{display:flex;align-items:stretch;gap:7px}
.deep-cell{flex:1;background:#FBF8F2;border-radius:10px;padding:9px 11px;font-size:14.5px;line-height:1.5;min-width:0}
.deep-cell .dc-cap{font-size:12.5px;font-weight:800;color:var(--paper-dim);display:block;margin-bottom:3px}
.deep-cell b{font-size:15px;word-break:keep-all}
.deep-arr{align-self:center;color:var(--paper-dim);font-weight:900;flex-shrink:0}

/* ── 버티기 순간 ── */
.choice-panel.hold::after{content:'';position:absolute;left:9px;right:9px;top:36px;bottom:9px;
  border:2.5px solid var(--signal);border-radius:20px;pointer-events:none;
  opacity:0;animation:holdFlash 1.05s ease 3}
.choice-panel.hold .cp-title{color:var(--signal);font-weight:700}
@keyframes holdFlash{0%,100%{opacity:0}45%{opacity:1;box-shadow:0 0 20px rgba(232,137,12,.45),inset 0 0 14px rgba(232,137,12,.14)}}

/* ── 마지막 거울: 간격 지도 ── */
.gapmap{background:#fff;border:1.5px solid #E8E2D6;border-radius:16px;
  padding:16px 12px 13px;margin-bottom:14px;box-shadow:0 3px 10px rgba(140,110,60,.07)}
.gapmap svg{display:block;width:100%;max-width:330px;margin:0 auto}
.gapmap .gm-legend{display:flex;justify-content:center;gap:16px;margin-top:8px;
  font-size:13.5px;font-weight:700;color:var(--paper-dim);flex-wrap:wrap}
.gapmap .gm-legend b{display:inline-block;width:13px;height:13px;border-radius:50%;
  margin-right:5px;vertical-align:-1.5px}
.gapmap .gm-sum{text-align:center;font-size:15px;margin-top:9px;line-height:1.65}

/* ══════════ v2 업그레이드 스타일 ══════════ */
/* 뒤로 가기 */
.backbtn{background:#fff;border:1.5px solid rgba(59,54,48,.22);border-radius:999px;
  padding:8px 16px;font-size:14.5px;font-weight:800;color:var(--paper-dim);cursor:pointer;
  font-family:var(--sans);align-self:flex-start;margin:0 0 12px;flex:none}
.backbtn:hover{border-color:var(--ripple);color:var(--ripple)}
.linky{background:none;border:none;color:var(--ripple);font-family:var(--sans);
  font-size:15px;font-weight:700;cursor:pointer;text-decoration:underline;padding:4px 2px}
.intro-sub{font-size:14px;color:var(--paper-dim);letter-spacing:.05em;margin:4px 0 0;font-weight:600}
/* 낱말 톡 사전 */
.word{border-bottom:2px dotted var(--ripple);background:rgba(61,123,245,.08);
  cursor:pointer;border-radius:4px;padding:0 2px;transition:.15s}
.word:hover{background:rgba(61,123,245,.16)}
.dicpop{position:fixed;z-index:300;max-width:290px;background:#fff;border:1.5px solid rgba(61,123,245,.4);
  border-radius:16px;box-shadow:0 10px 30px rgba(60,80,140,.2);padding:13px 15px;
  font-family:var(--sans);animation:msgIn .25s ease}
.dicpop .dp-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.dicpop .dp-w{font-weight:900;font-size:16px;color:var(--ripple)}
.dicpop .dp-m{font-size:14.5px;line-height:1.6;color:var(--paper)}
.dicpop .dp-e{font-size:13.5px;line-height:1.6;color:var(--paper-dim);margin-top:6px;
  border-top:1px dashed rgba(59,54,48,.15);padding-top:6px}
.wordcount{font-size:13px;color:var(--ripple);font-weight:800;margin:0 0 10px}
/* 물결이 코치마크 */
.coach{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:250;
  display:flex;align-items:center;gap:9px;background:#fff;border:1.5px solid rgba(61,123,245,.4);
  border-radius:999px;padding:8px 18px 8px 9px;box-shadow:0 8px 26px rgba(60,80,140,.22);
  font-size:14.5px;font-weight:700;color:var(--paper);font-family:var(--sans);
  animation:msgIn .4s ease;max-width:88vw}
.coach.bye{opacity:0;transition:opacity .6s}
/* 온보딩 */
.onb{position:fixed;inset:0;z-index:400;background:rgba(43,38,32,.5);display:flex;
  align-items:center;justify-content:center;padding:22px}
.onb-card{background:var(--ink);border-radius:24px;max-width:370px;width:100%;
  padding:30px 24px 22px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.onb-card h3{font-family:var(--serif);font-size:23px;margin:12px 0 10px}
.onb-card p{font-size:15.5px;line-height:1.8;color:var(--paper-dim);margin-bottom:8px}
.onb-card p b{color:var(--paper)}
.onb-dots{display:flex;gap:6px;justify-content:center;margin:14px 0 4px}
.onb-dots i{width:8px;height:8px;border-radius:50%;background:rgba(59,54,48,.2)}
.onb-dots i.on{background:var(--ripple)}
.onb-flow{display:flex;justify-content:center;gap:5px;align-items:center;
  font-size:12.5px;font-weight:800;color:var(--paper-dim);margin:12px 0;flex-wrap:wrap}
.onb-flow span{background:#fff;border:1px solid rgba(59,54,48,.15);border-radius:999px;padding:6px 10px}
.onb-skip{background:none;border:none;color:var(--paper-dim);font-size:14px;
  text-decoration:underline;cursor:pointer;font-family:var(--sans);margin-top:10px}
/* 유형 카드 */
.type-card{border-radius:22px;padding:24px 20px;margin-bottom:14px;text-align:center;
  border:2px solid;position:relative;background:#fff}
.type-card .tc-wol{display:flex;justify-content:center;gap:8px;align-items:center;
  font-size:14px;font-weight:800;color:var(--paper-dim);margin-bottom:8px}
.type-card .tc-emoji{font-size:56px;line-height:1.2}
.type-card .tc-name{font-family:var(--serif);font-size:29px;font-weight:700;margin:4px 0 2px}
.type-card .tc-sub{font-size:15.5px;font-weight:700;opacity:.85;margin-bottom:12px}
.type-card .tc-fixed{font-size:13.5px;color:var(--paper-dim);margin-top:14px;line-height:1.65}
.type-duo{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px;text-align:left}
.type-duo .td-cell{background:rgba(0,0,0,.03);border-radius:13px;padding:12px 13px}
.type-duo .td-cap{font-size:12.5px;font-weight:900;margin-bottom:5px}
.type-duo .td-tx{font-size:14px;line-height:1.6;color:var(--paper)}
.type-why{margin-top:12px;text-align:left;font-size:14px}
.type-why summary{cursor:pointer;font-weight:800;color:var(--paper-dim)}
.type-why .tw-row{display:flex;justify-content:space-between;gap:8px;padding:7px 4px;
  border-bottom:1px dashed rgba(59,54,48,.12);font-size:14px}
.subbadges{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.subbadges span{font-size:13px;font-weight:800;background:#FFF4D8;border:1px solid rgba(232,137,12,.4);
  color:#9A6206;border-radius:999px;padding:6px 12px}
/* 실천 미션 */
.mission-card{background:linear-gradient(135deg,#E1F3E9,#F2FBF6);border:1.5px solid rgba(46,158,116,.45);
  border-radius:18px;padding:18px;margin-bottom:14px}
.mission-card .mc-head{display:flex;align-items:center;gap:8px;font-size:13px;
  letter-spacing:.14em;font-weight:900;color:var(--sprout);margin-bottom:9px}
.mission-card .mc-tx{font-family:var(--serif);font-size:17.5px;line-height:1.75}
.mission-card .mc-note{font-size:13px;color:var(--paper-dim);margin-top:9px}
.mission-ask{background:#fff;border:1.5px dashed rgba(46,158,116,.5);border-radius:18px;
  padding:16px;margin-bottom:14px}
.mission-ask .ma-q{display:flex;gap:9px;align-items:center;font-size:15px;font-weight:700;margin-bottom:11px;line-height:1.5}
.mission-ask .ma-btns{display:flex;gap:8px}
.mission-ask .ma-btns button{flex:1;font-family:var(--sans);font-weight:800;font-size:15px;
  border-radius:12px;border:1.5px solid rgba(46,158,116,.45);background:#F2FBF6;color:var(--sprout);
  padding:11px;cursor:pointer}
/* 결과 카드 오버레이 */
.shareov{position:fixed;inset:0;z-index:500;background:rgba(30,26,20,.72);display:flex;
  flex-direction:column;align-items:center;justify-content:center;padding:18px;gap:12px}
.shareov img{max-width:min(86vw,420px);max-height:60vh;border-radius:18px;
  box-shadow:0 16px 50px rgba(0,0,0,.45)}
.shareov .so-btns{display:flex;gap:9px;flex-wrap:wrap;justify-content:center}
.shareov .so-btns button{font-family:var(--sans);font-weight:800;font-size:15px;border:none;
  border-radius:12px;padding:12px 18px;cursor:pointer;background:#fff;color:var(--paper)}
.shareov .so-hint{color:#EADFCE;font-size:13.5px;text-align:center;line-height:1.6}
/* 교사용 막대(v1 정의 누락 보완) */
.bar-label{display:flex;justify-content:space-between;font-size:15px;margin-bottom:5px}
.bar-track{height:13px;background:rgba(59,54,48,.1);border-radius:999px;overflow:hidden;margin-bottom:12px}
.bar-fill{display:block;height:100%;border-radius:999px}

</head>
<body>
<div id="app"></div>
<script>
/* ══════════════════════════════════════════════
   너라면 어떻게 할래? — v2 통합판 (시나리오 1~4)
   부제: 피부에 닿는 민주주의 · 나의 선택이 만드는 물결
══════════════════════════════════════════════ */
const $app = document.getElementById('app');
const IS_GAS = typeof google !== 'undefined' && google.script && google.script.run;
const S = {
  check:[null,null,null,null,null],
  extra:{},                 // 시나리오별 속마음·추정·이중선택·물러섬 {1:{inner,ideal,guess,folded,said}, ...}
  code:null,                // 이어하기 익명 코드 (예: 하늘123)
  cur:null,                 // 진행 중 시나리오 번호
  c1:null, c2:null,         // 현재 시나리오의 선택
  done:{},                  // {1:{c1,c2,stance}, ...}
  notes:{},                 // 시나리오별로 적은 생각 {1:{q,t}, ...} — 이 기기에만 저장
  trail:{},                 // 시나리오별 선택 기록(이어하기·다시보기용) {1:[{t,k,...}], ...}
  ui:{ rippleSeen:{}, lawSolved:{}, drafts:{}, feedHot:0 },
  rec:{},                   // 시나리오별 서버 기록 여부
  speed:1
};

/* ── 내비게이션 스택 (R1) ── */
let NAV = [];
let POPGUARD = false;
function nav(fn){
  const a = Array.prototype.slice.call(arguments,1);
  NAV.push({fn:fn, a:a});
  try{ history.pushState({d:NAV.length}, ''); }catch(e){}
  fn.apply(null,a);
}
function navHome(){ NAV=[{fn:scrHome,a:[]}]; scrHome(); }
function goBack(){
  if(NAV.length<2) return;
  try{ POPGUARD=true; history.back(); }catch(e){}
  NAV.pop();
  const t=NAV[NAV.length-1];
  t.fn.apply(null,t.a);
}
window.addEventListener('popstate', ()=>{
  if(POPGUARD){ POPGUARD=false; return; }
  if(NAV.length>1){
    NAV.pop();
    const t=NAV[NAV.length-1];
    t.fn.apply(null,t.a);
  }
});

/* ── 서버(Apps Script) 연동 ── */
function record(n){
  if(S.rec[n]) return; S.rec[n]=true;
  if(IS_GAS){ try{
    const d=S.done[n];
    google.script.run.recordEvent(JSON.stringify({sc:n,c1:d.c1,c2:d.c2,stance:d.stance}));
  }catch(e){} }
}
function fetchStats(cb){
  if(IS_GAS){ try{
    google.script.run.withSuccessHandler(s=>{try{cb(JSON.parse(s))}catch(e){cb(null)}})
      .withFailureHandler(()=>cb(null)).getStats();
  }catch(e){cb(null)} } else cb(null);
}

/* ══════════ 이어하기 — 자동 저장·자동 복원 (R2) ══════════
 * 프라이버시 원칙: 속마음(inner)·추정(guess)·생각 조각(notes)은
 * 서버로 보내지 않고 이 기기(localStorage)에만 저장한다. */
const CODE_WORDS = ['하늘','바다','새싹','달빛','노을','구름','파도','별빛','들꽃','숲길',
  '나무','바람','이슬','노래','웃음','마음','햇살','단풍','눈꽃','봄비',
  '아침','저녁','강물','초록','보라','진주','연두','산새','들판','고래'];
function genCode(){ return CODE_WORDS[Math.floor(Math.random()*CODE_WORDS.length)] + (100+Math.floor(Math.random()*900)); }
function ensureCode(){
  if(S.code) return;
  try{ const c = localStorage.getItem('pinu_code'); if(c && /^[가-힣]{2}\d{3}$/.test(c)){ S.code = c; return; } }catch(e){}
  S.code = genCode();
  try{ localStorage.setItem('pinu_code', S.code); }catch(e){}
  // 코드 충돌 방지: 이미 서버에서 쓰는 코드면 새로 발급 (비동기)
  if(IS_GAS){ try{
    google.script.run.withSuccessHandler(j=>{
      if(j){ S.code = genCode(); try{ localStorage.setItem('pinu_code', S.code); }catch(e){} saveProgress(); }
    }).loadState(S.code);
  }catch(e){} }
}
function sanitizeExtra_(){ // 서버 저장용 — 비공개 항목 제거
  const o={};
  Object.keys(S.extra).forEach(k=>{
    const e=S.extra[k]||{}, c={};
    if(e.folded) c.folded=true;
    if(e.said) c.said=e.said;
    if(e.ideal) c.ideal=e.ideal;
    o[k]=c;
  });
  return o;
}
function sanitizeTrail_(){ // 서버 저장용 — 자유 입력 원문은 유지(대화에 노출된 내용), 속마음(i)·추정(g)은 제거
  const o={};
  Object.keys(S.trail).forEach(k=>{
    o[k]=(S.trail[k]||[]).filter(r=>r.t!=='i'&&r.t!=='g');
  });
  return o;
}
function packServer(){ return JSON.stringify({ v:2, check:S.check, done:S.done, extra:sanitizeExtra_(), trail:sanitizeTrail_() }); }
function packLocal(){ return JSON.stringify({ v:2, check:S.check, done:S.done, extra:S.extra, notes:S.notes, trail:S.trail, ui:S.ui }); }
function applyState(o){
  if(!o || (o.v!==1 && o.v!==2)) return false;
  S.check = o.check || S.check;
  S.done  = o.done  || {};
  S.extra = o.extra || {};
  S.notes = o.notes || {};
  S.trail = o.trail || {};
  S.ui = Object.assign({rippleSeen:{},lawSolved:{},drafts:{},feedHot:0}, o.ui||{});
  Object.keys(S.done).forEach(k=>{ S.rec[k]=true; }); // 재접속 시 집계 중복 방지
  return true;
}
function saveProgress(){
  if(!S.code) return;
  try{ localStorage.setItem('pinu_state_'+S.code, packLocal()); }catch(e){}
  if(IS_GAS){ try{ google.script.run.saveState(S.code, packServer()); }catch(e){} }
}
function loadProgress(code, cb){
  const fin = srv=>{
    let loc=null;
    try{ const j=localStorage.getItem('pinu_state_'+code); if(j) loc=JSON.parse(j); }catch(e){}
    if(srv && loc){
      // 병합: 서버(공개 항목) + 로컬(비공개 항목·화면 상태)이 함께 복원되게
      srv.notes = loc.notes || srv.notes;
      srv.ui = loc.ui || srv.ui;
      if(!srv.trail || !Object.keys(srv.trail).length) srv.trail = loc.trail;
      if(loc.extra){
        srv.extra = srv.extra || {};
        Object.keys(loc.extra).forEach(k=>{
          srv.extra[k] = Object.assign({}, srv.extra[k]||{}, loc.extra[k]);
        });
      }
      cb(srv);
    } else cb(srv || loc);
  };
  if(IS_GAS){
    try{
      google.script.run.withSuccessHandler(j=>{ let o=null; try{ o=j?JSON.parse(j):null; }catch(e){} fin(o); })
        .withFailureHandler(()=>fin(null)).loadState(code);
    }catch(e){ fin(null); }
  } else fin(null);
}

/* ── 공통 유틸 ── */
function esc(t){ return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function el(html){ const d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstElementChild; }
function show(node){
  $app.innerHTML=''; $app.appendChild(node); node.classList.add('on');
  window.scrollTo(0,0);
  document.documentElement.scrollTop = 0;
  document.body.scrollTop = 0;
  $app.scrollTop = 0;
  node.scrollTop = 0;
  requestAnimationFrame(()=>{ window.scrollTo(0,0); node.scrollTop = 0; });
  // 뒤로 가기 버튼 (R1) — 채팅 화면은 자체 상단 바에 배치
  if(NAV.length>1 && !node.classList.contains('chatworld') && !node.classList.contains('noback')){
    const host = node.querySelector('.ripple-wrap') || node;
    const b = el('<button class="backbtn" aria-label="뒤로 가기">← 뒤로</button>');
    b.onclick = goBack;
    host.insertBefore(b, host.firstChild);
  }
  // 사전 팝오버 닫기
  const dp=document.getElementById('dicpop'); if(dp) dp.remove();
}
function doneCount(){ return Object.keys(S.done).length; }

/* ══════════ 물결이 — 안내 캐릭터 (R7) ══════════ */
function wolSVG(size, expr){
  expr = expr || 'base';
  const eyes = expr==='joy'
    ? '<path d="M 15 29.5 q 3 -3.4 6 0" stroke="#4A3318" stroke-width="2.2" fill="none" stroke-linecap="round"/><path d="M 27 29.5 q 3 -3.4 6 0" stroke="#4A3318" stroke-width="2.2" fill="none" stroke-linecap="round"/>'
    : '<circle cx="18" cy="30" r="2" fill="#4A3318"/><circle cx="30" cy="30" r="2" fill="#4A3318"/>';
  const mouth = expr==='think'
    ? '<circle cx="24" cy="37.5" r="2.4" fill="#4A3318"/>'
    : '<path d="M 19 35.5 Q 24 '+(expr==='joy'?'41.5':'39')+' 29 35.5" stroke="#4A3318" stroke-width="2" fill="none" stroke-linecap="round"/>';
  const spark = expr==='joy'
    ? '<path d="M 41 14 l 1 2.2 2.2 1 -2.2 1 -1 2.2 -1 -2.2 -2.2 -1 2.2 -1 Z" fill="#F2A93B"/>'
    : '';
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 48 54" aria-label="물결이" style="flex:none">'
    + '<circle cx="24" cy="34" r="14" fill="#F2A93B"/>'
    + eyes + mouth
    + '<ellipse cx="14.5" cy="35" rx="2.6" ry="1.7" fill="#E4573D" opacity=".45"/>'
    + '<ellipse cx="33.5" cy="35" rx="2.6" ry="1.7" fill="#E4573D" opacity=".45"/>'
    + '<path d="M 24 20 Q 23 15.5 24 12" stroke="#7FB59B" stroke-width="2" fill="none" stroke-linecap="round"/>'
    + '<path d="M 24 13 Q 16.5 11 17 5 Q 22.8 7.5 24 13 Z" fill="#7FB59B"/>'
    + '<path d="M 24 13 Q 31.5 11 31 5 Q 25.2 7.5 24 13 Z" fill="#A9CDBB"/>'
    + spark + '</svg>';
}

/* ── 코치마크 (R5) ── */
function coach(id, txt){
  try{
    if(localStorage.getItem('pinu_cm_'+id)) return;
    localStorage.setItem('pinu_cm_'+id,'1');
  }catch(e){ return; }
  const c = el('<div class="coach">'+wolSVG(34)+'<span>'+txt+'</span></div>');
  document.body.appendChild(c);
  setTimeout(()=>{ c.classList.add('bye'); setTimeout(()=>c.remove(), 700); }, 5600);
}

/* ══════════ 낱말 톡 사전 (R6) ══════════ */
const DICT = {
  '존엄': { m:'어떤 사람이든 그 자체로 소중하다는 뜻이에요.', e:'누가 어디 살든, 공부를 잘하든 못하든, 함부로 대해도 되는 사람은 없어요.' },
  '주권': { m:'나라의 주인으로서 결정할 수 있는 힘이에요.', e:'우리 반 일을 우리 반이 정하는 것처럼, 나라의 일은 국민이 정해요.' },
  '공화국': { m:'나라가 어느 한 사람의 것이 아니라 모두의 것이라는 뜻이에요.', e:'왕이 다스리는 나라가 아니라, 국민이 함께 주인인 나라예요.' },
  '균등': { m:'조건 때문에 밀려나는 사람 없이, 고르게 기회를 준다는 뜻이에요.', e:'집에 컴퓨터가 없어도 배울 기회는 똑같이 있어야 해요.' },
  '기본권': { m:'사람이라면 누구나 처음부터 가지고 있는 권리예요.', e:'투표로도 빼앗을 수 없어요. 예를 들면 안전하게 살 권리 같은 것요.' },
  '침해': { m:'남의 권리나 소중한 것을 함부로 건드려 다치게 하는 거예요.', e:'허락 없이 남의 비밀을 퍼뜨리는 것도 침해예요.' },
  '명예': { m:'그 사람에 대한 좋은 평판, 사람들이 그 사람을 보는 눈이에요.', e:'가짜 소문이 퍼지면 그 사람의 명예가 다쳐요.' },
  '사생활': { m:'남에게 보여 주지 않아도 되는, 나만의 생활과 이야기예요.', e:'우리 집 사정을 어디까지 말할지는 내가 정할 수 있어요.' },
  '다수결': { m:'더 많은 사람이 고른 쪽으로 정하는 방법이에요.', e:'편리한 도구지만, 정하기 전에 소수의 사정을 살피는 게 먼저예요.' },
  '소수': { m:'여럿 가운데 수가 적은 쪽 사람들이에요.', e:'투표에서 진 쪽, 몸이 불편한 친구처럼 수가 적다고 틀린 건 아니에요.' },
  '알 권리': { m:'정확한 정보를 알 수 있어야 한다는 권리예요.', e:'가짜 뉴스가 많아지면 이 권리가 망가져요.' },
  '언론·출판': { m:'말과 글, 영상으로 생각을 세상에 내놓는 일이에요.', e:'유튜브에 영상을 올리는 것도 여기에 들어가요.' },
  '집회·결사': { m:'여럿이 모여 뜻을 밝히거나 모임을 만드는 일이에요.', e:'같은 생각을 가진 사람들이 동아리를 만드는 것도 포함돼요.' },
  '타협': { m:'한쪽이 지는 게 아니라, 둘 다 담기는 더 큰 답을 찾는 거예요.', e:'이어달리기도 하고 단체줄넘기도 하기로 한 것처럼요.' },
  '익명': { m:'이름을 밝히지 않는 거예요.', e:'이 앱은 누가 골랐는지 몰라요. 몇 명이 골랐는지만 세요.' }
};
function dicify(h){
  Object.keys(DICT).forEach(w=>{
    if(h.indexOf('data-w="'+w+'"') > -1) return;      // 이미 처리됨
    const re = new RegExp('(^|>)([^<]*?)'+w);
    if(re.test(h)) h = h.replace(re, (m,a,b)=> a+b+'<span class="word" data-w="'+w+'" tabindex="0" role="button">'+w+'</span>');
  });
  return h;
}
function dicifyIn(root, sel){
  root.querySelectorAll(sel).forEach(e=>{
    if(e.querySelector('button,input,textarea,a,select')) return;
    e.innerHTML = dicify(e.innerHTML);
  });
}
function dictSeen(w){
  try{
    const a = JSON.parse(localStorage.getItem('pinu_dict')||'[]');
    if(a.indexOf(w)<0){ a.push(w); localStorage.setItem('pinu_dict', JSON.stringify(a)); }
  }catch(e){}
}
function dictCount(){ try{ return (JSON.parse(localStorage.getItem('pinu_dict')||'[]')).length; }catch(e){ return 0; } }
function openDicPop(wEl){
  const old=document.getElementById('dicpop'); if(old) old.remove();
  const w = wEl.dataset.w, d = DICT[w];
  if(!d) return;
  dictSeen(w);
  const p = el('<div class="dicpop" id="dicpop"><div class="dp-head">'+wolSVG(30)
    +'<span class="dp-w">'+w+'</span></div><div class="dp-m">'+d.m+'</div><div class="dp-e">'+d.e+'</div></div>');
  document.body.appendChild(p);
  const r = wEl.getBoundingClientRect();
  let left = Math.min(Math.max(10, r.left), window.innerWidth - p.offsetWidth - 10);
  let top = r.top - p.offsetHeight - 8;
  if(top < 8) top = r.bottom + 8;
  p.style.left = left+'px'; p.style.top = top+'px';
}
document.addEventListener('click', e=>{
  const w = e.target.closest && e.target.closest('.word');
  if(w){ e.stopPropagation(); openDicPop(w); return; }
  const p = document.getElementById('dicpop');
  if(p && !e.target.closest('.dicpop')) p.remove();
});
document.addEventListener('keydown', e=>{
  if(e.key==='Enter' && e.target.classList && e.target.classList.contains('word')){ openDicPop(e.target); }
  if(e.key==='Escape'){ const p=document.getElementById('dicpop'); if(p) p.remove(); }
});

/* ══════════ 온보딩 (R5) ══════════ */
function showOnb(setFlag){
  const CARDS = [
    { w:'joy', h:'안녕! 나는 물결이예요',
      b:'<p>이 앱은 <b>이야기 속에서 네가 직접 고르는 앱</b>이에요.<br>단톡방, 조별과제, 영상 피드, 학급회의 —<br>진짜 우리 일상 같은 이야기 네 개가 준비돼 있어요.</p>' },
    { w:'base', h:'약속 세 가지',
      b:'<p>① <b>정답도 점수도 없어요.</b> 채점하지 않아요.<br>② <b>이름을 묻지 않아요.</b> 누가 골랐는지 아무도 몰라요.<br>③ 그러니까 <b>솔직하게</b> — 평소의 나로 골라 주세요.</p>' },
    { w:'joy', h:'이렇게 걸어요',
      b:'<p>이야기 하나에 10분쯤 걸려요.</p><div class="onb-flow"><span>선택하기</span>→<span>물결 보기</span>→<span>헌법 렌즈</span>→<span>거울 보기</span></div><p>네 개를 다 걸으면 <b>나의 물결 유형</b>과<br><b>시민 나이테</b>를 받아요.</p>' }
  ];
  let i = 0;
  const ov = el('<div class="onb"><div class="onb-card" id="onbC"></div></div>');
  document.body.appendChild(ov);
  function fin(){ ov.remove(); if(setFlag){ try{ localStorage.setItem('pinu_onb','1'); }catch(e){} } }
  function render(){
    const c = CARDS[i];
    ov.querySelector('#onbC').innerHTML = wolSVG(74, c.w) + '<h3>'+c.h+'</h3>' + c.b
      + '<div class="onb-dots">'+CARDS.map((x,k)=>'<i class="'+(k===i?'on':'')+'"></i>').join('')+'</div>'
      + '<button class="btn" id="onbN">'+(i<CARDS.length-1?'다음':'좋아, 시작할게!')+'</button>'
      + '<div><button class="onb-skip" id="onbS">건너뛰기</button></div>';
    ov.querySelector('#onbN').onclick = ()=>{ if(i<CARDS.length-1){ i++; render(); } else fin(); };
    ov.querySelector('#onbS').onclick = fin;
  }
  render();

        if(S.check.every(x=>x!==null)) navHome();

      });

    (()=>{ // 새로 시작: 두 번 눌러 확정
      const f = btns.querySelector('#fresh');
      let armed=false, timer=null;

      }
    });
  };
  sc.querySelector('#onbAgain').onclick = ()=>showOnb(false);
  sc.querySelector('#guideGo').onclick = ()=>nav(scrGuide);
  show(sc);
}

];
function scrCheck(){
  const sc = el(`<section class="screen night">
    <div class="eyebrow">들어가기 전에</div>
    <h2>당신은 어떤 사람인가요?</h2>

    <div id="qs"></div>
    <div class="spacer"></div>
    <button class="btn" id="go" disabled style="opacity:.4">물결 지도 열기</button>
  </section>`);
  const qs = sc.querySelector('#qs');
  function gateCheck(){
    if(S.check.every(x=>x!==null)){ const b=sc.querySelector('#go'); b.disabled=false; b.style.opacity=1; }
  }
  CHECK_Q.forEach((q,qi)=>{
    const card = el(`<div class="q-card"><div class="q">“${q}”</div>
      <div class="dots" role="radiogroup" aria-label="${q}"></div>
      <div class="dots-label"><span>전혀 아니다</span><span>매우 그렇다</span></div></div>`);
    const dots = card.querySelector('.dots');
    for(let v=1; v<=5; v++){
      const d = el(`<button class="dot" role="radio" aria-label="${v}점"></button>`);
      d.onclick = ()=>{
        S.check[qi]=v;
        dots.querySelectorAll('.dot').forEach((x,i)=>x.classList.toggle('sel', i<v));
        saveProgress();
        gateCheck();
      };
      dots.appendChild(d);
    }
    // 뒤로 갔다 돌아와도 입력 유지 (R1)
    if(S.check[qi]!==null){
      dots.querySelectorAll('.dot').forEach((x,i)=>x.classList.toggle('sel', i<S.check[qi]));
    }
    qs.appendChild(card);
  });
  gateCheck();
  sc.querySelector('#go').onclick = ()=>navHome();
  show(sc);
}

function hubRingSVG(){
  const cx=48, cy=54, rs=[12,20,28,36];
  let out = `<circle cx="${cx}" cy="${cy}" r="39" fill="rgba(59,54,48,.05)"/>`;
  [1,2,3,4].forEach((n,i)=>{
    const r=rs[i], d=S.done[n], circ=(2*Math.PI*r).toFixed(1);
    out += d
      ? `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none"
           stroke="${STANCE_META[n][d.stance].c}" stroke-width="5.5" stroke-linecap="round"
           stroke-dasharray="${(circ*0.88).toFixed(1)} ${(circ*0.12).toFixed(1)}"
           transform="rotate(${n*67} ${cx} ${cy})" opacity=".95"/>`
      : `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none"
           stroke="rgba(59,54,48,.18)" stroke-width="1.6" stroke-dasharray="2.5 5"/>`;
  });
  out += `<circle cx="${cx}" cy="${cy}" r="8" fill="#F2A93B"/>
    <circle cx="${cx-3}" cy="${cy-1.5}" r="1.4" fill="#4A3318"/>
    <circle cx="${cx+3}" cy="${cy-1.5}" r="1.4" fill="#4A3318"/>
    <path d="M ${cx-3.4} ${cy+1.8} Q ${cx} ${cy+4.8} ${cx+3.4} ${cy+1.8}"

    <ellipse cx="${cx+5.8}" cy="${cy+1.2}" rx="1.7" ry="1.1" fill="#E4573D" opacity=".45"/>`;
  out += `<path d="M ${cx} 16 Q ${cx-1} 11.5 ${cx} 8.5"
      stroke="#7FB59B" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <path d="M ${cx} 9.5 Q ${cx-8.5} 7 ${cx-8} 1.5 Q ${cx-1.5} 3.5 ${cx} 9.5 Z" fill="#7FB59B"/>
    <path d="M ${cx} 9.5 Q ${cx+8.5} 7 ${cx+8} 1.5 Q ${cx+1.5} 3.5 ${cx} 9.5 Z" fill="#A9CDBB"/>`;
  const spark=(x,y,s,o)=>`<path d="M ${x} ${y-s} L ${x+s*.32} ${y-s*.32} L ${x+s} ${y} L ${x+s*.32} ${y+s*.32} L ${x} ${y+s} L ${x-s*.32} ${y+s*.32} L ${x-s} ${y} L ${x-s*.32} ${y-s*.32} Z" fill="#F2A93B" opacity="${o}"/>`;

function startScenario(n, restart){
  S.cur=n; S.c1=null; S.c2=null;
  const resume = !restart && S.trail[n] && S.trail[n].length && !S.done[n];
  if(!resume){
    S.trail[n]=[]; S.extra[n]={};
    if(S.ui.rippleSeen) delete S.ui.rippleSeen[n];
    if(S.ui.lawSolved) delete S.ui.lawSolved[n];
    saveProgress();
  }

}

const WHO = { 민재:'😎', 서준:'🏀', 하율:'🎧', 유나:'🐰', 다은:'📚', 준호:'⚽', 시우:'🙂', 수아:'⭐', 도윤:'🌿', 지호:'🌙', 조리사님:'🍚' };
const ROOM0 = { 1:['5학년 2반','23'], 2:['국어 모둠 4조','4'], 3:['5학년 2반','23'], 4:['학급회의 · 5학년 2반','23'] };

const shuf = a => a.slice().sort(()=>Math.random()-.5);
function scrChat(n){
  S.cur = n;
  // 이어하기·다시 보기(R1): 기록된 선택을 즉시 재적용하며 대화를 재구성한다
  let RQ = (S.trail[n] && S.trail[n].length) ? S.trail[n].slice() : null;
  const FAST = !!(RQ && S.done[n]); // 완료된 시나리오 다시 보기 — 끝까지 즉시 재생
  const D = ms => (RQ || FAST) ? 0 : ms*S.speed;
  const rec = o => { if(RQ) return; (S.trail[n]=S.trail[n]||[]).push(o); saveProgress(); };
  const rqNext = t => {
    if(!RQ || !RQ.length){ RQ=null; return null; }
    if(RQ[0].t!==t){ RQ=null; return null; } // 기록과 대본이 어긋나면 라이브로 전환
    const r = RQ.shift();
    if(!RQ.length && !FAST) RQ=null;
    return r;
  };
  const sc = el(`<section class="screen chatworld">
    <div class="chat-top">
      <button class="live" id="bk" style="background:none;border:1px solid #D8DEE8;border-radius:999px;padding:4px 12px;cursor:pointer;font-family:var(--sans);margin-left:0;font-size:13px" aria-label="뒤로 가기">←</button>
      <span class="room" id="room">${ROOM0[n][0]}</span><span class="cnt" id="cnt">${ROOM0[n][1]}</span>
      <button class="live" id="rst" style="background:none;border:1px solid #D8DEE8;border-radius:999px;padding:4px 10px;cursor:pointer;font-family:var(--sans)">↺ 처음부터</button>
      <button class="live" id="ff" style="background:none;border:1px solid #D8DEE8;border-radius:999px;padding:4px 10px;cursor:pointer;font-family:var(--sans);margin-left:6px">⏩ 빨리감기</button>
    </div>
    <div class="chat-scroll" id="scroll"></div>
    <div class="choice-panel" id="panel"></div>
  </section>`);
  sc.querySelector('#bk').onclick = ()=>goBack();
  (()=>{ // 처음부터: 팝업 없이 두 번 눌러 확정 (GAS에서는 confirm 창이 차단됨)
    const rst = sc.querySelector('#rst');
    let armed = false, timer = null;
    rst.onclick = ()=>{
      if(armed){ clearTimeout(timer); startScenario(n, true); return; }
      armed = true;
      rst.textContent = '한 번 더 누르면 처음부터!';
      rst.style.borderColor = 'var(--signal)';
      rst.style.color = 'var(--signal)';
      timer = setTimeout(()=>{
        armed = false;
        rst.textContent = '↺ 처음부터';
        rst.style.borderColor = '#D8DEE8';
        rst.style.color = '';
      }, 3500);
    };
  })();
  sc.querySelector('#ff').onclick = (e)=>{
    S.speed = S.speed===1 ? .22 : 1;
    e.target.textContent = S.speed===1 ? '⏩ 빨리감기' : '▶ 보통 속도';
  };
  show(sc);
  const scroll = sc.querySelector('#scroll'), panel = sc.querySelector('#panel');
  let stick = true; // 사용자가 위로 스크롤하면 자동 따라가기를 멈춘다
  scroll.addEventListener('scroll', ()=>{
    stick = scroll.scrollHeight - scroll.scrollTop - scroll.clientHeight < 90;
  });
  const down = (force)=>{ if(stick || force) scroll.scrollTop = scroll.scrollHeight; };
  const openPanel = ()=>{
    requestAnimationFrame(()=>{
      scroll.style.paddingBottom = (panel.offsetHeight + 28) + 'px';
      down(true);
    });
  };
  const closePanel = ()=>{ panel.classList.remove('up'); panel.innerHTML=''; scroll.style.paddingBottom=''; };
  let lastWho = null;
  let saidOverride = null;   // 직접 쓴 말 — 다음 '내 말풍선'을 이 문장으로 교체

  function freeUI(st){
    return `<button class="opt free-toggle" id="freeT">✏️ 내 말로 직접 쓰기<span class="tag">고른 말 말고, 진짜 내가 할 말 그대로</span></button>
      <div class="free-box" id="freeB" style="display:none">
        <textarea id="freeTa" rows="2" maxlength="120" placeholder="${st.free.ph}"></textarea>
        <button class="opt" id="freeGo" style="text-align:center;border-color:var(--signal)">이 말로 하기 →</button>
        <div class="note" id="freeMsg" style="margin:6px 0 0;text-align:center"></div>
      </div>`;
  }
  function wireFree(st, next){
    const t = panel.querySelector('#freeT'); if(!t) return;
    t.onclick = ()=>{
      panel.querySelector('#freeB').style.display='block';
      t.style.display='none'; openPanel();
      panel.querySelector('#freeTa').focus();
    };
    panel.querySelector('#freeGo').onclick = ()=>{
      const txt = panel.querySelector('#freeTa').value.trim();

  function applyFree(r){

  function put(node){ scroll.appendChild(node); down(); }
  function msg(who, text, mine){

  }
  function typing(who){
    return el(`<div class="msg typing"><div class="avatar">${WHO[who]||''}</div>
      <div class="body"><div class="name">${who}</div><div class="bubble">···</div></div></div>`);
  }
  function card(who, inner){

      <div class="body"><div class="name">${who}</div>${inner}</div></div>`);
  }
  function pollResult(p, st, my){
    const total = st.opts.reduce((a,o)=>a+o.v,0)+1;
    const win = st.opts.reduce((m,o,k)=> (o.v+(k===my?1:0)) > (st.opts[m].v+(m===my?1:0)) ? k : m, 0);
    p.innerHTML = `<div class="p-q">${st.q} — 결과</div>` + st.opts.map((o,k)=>{
      const v = o.v+(k===my?1:0), pct = Math.round(v/total*100);
      return `<div class="p-res ${k===win?'win':''}"><div class="pr-l"><span>${o.x}${k===my?' (내 표)':''}</span><span>${v}표</span></div>
        <div class="pr-b"><i style="width:${pct}%"></i></div></div>`;
    }).join('');
  }

  function play(steps, done){
    let i = 0;
    (function next(){
      if(i>=steps.length){ done&&done(); return; }
      const st = steps[i++];
      if(st.t==='sys'){ put(el(`<div class="sysline">${st.x}</div>`)); setTimeout(next, D(900)); }
      else if(st.t==='narr'){ setTimeout(()=>{ put(el(`<div class="narr">${dicify(st.x)}</div>`)); setTimeout(next, D(Math.min(1400 + st.x.length*18, 4200))); }, D(600)); }
      else if(st.t==='mine'){
        if(saidOverride){ put(msg(null, esc(saidOverride), true)); saidOverride=null; }
        else put(msg(null, st.x, true));
        setTimeout(next, D(1200));
      }
      else if(st.t==='msg'){
        const tp = typing(st.who); put(tp);
        const d = D(Math.min(700 + st.x.length*30, 2600));
        setTimeout(()=>{ tp.replaceWith(msg(st.who, st.x)); down(); setTimeout(next, D(Math.min(600 + st.x.length*14, 1800))); }, d);
      }
      else if(st.t==='card'){
        const tp = typing(st.who); put(tp);
        setTimeout(()=>{ tp.replaceWith(card(st.who, st.html)); down(); setTimeout(next, D(2600)); }, D(1600));
      }
      else if(st.t==='poll'){
        const p = el(`<div class="poll"><div class="p-q">${st.q}</div>
          ${st.opts.map((o,k)=>`<button class="p-opt" data-k="${k}">${o.x}</button>`).join('')}</div>`);
        put(card(st.who, '')); scroll.lastChild.querySelector('.body').appendChild(p); down();
        const r = rqNext('p');
        if(r){ pollResult(p, st, r.k); down(); setTimeout(next, D(1800)); return; }
        p.querySelectorAll('.p-opt').forEach(b=>{
          b.onclick = ()=>{
            const my = +b.dataset.k;
            rec({t:'p', k:my});

            down(); setTimeout(next, D(1800));
          };
        });
      }
      else if(st.t==='pause'){ setTimeout(next, D(st.ms)); }
      else if(st.t==='room'){ sc.querySelector('#room').textContent=st.x; sc.querySelector('#cnt').textContent=st.n||''; put(el(`<div class="sysline">${st.x} 님과의 대화</div>`)); lastWho=null; setTimeout(next, D(600)); }
      else if(st.t==='choice'){
        const r = rqNext('c');
        if(r){ applyFree(r); panel.classList.remove('hold'); st.pick(r.k, next); return; }
        const opts = st.keepOrder ? st.opts : shuf(st.opts);
        panel.classList.toggle('hold', !!st.hold);
        panel.innerHTML = `<div class="cp-title">${st.title}</div>` +
          opts.map(o=>`<button class="opt" data-k="${o.k}">${o.x}${o.tag?`<span class="tag">${o.tag}</span>`:''}</button>`).join('') +
          (st.free ? freeUI(st) : '');
        setTimeout(()=>{ panel.classList.add('up'); openPanel(); }, 250);
        panel.querySelectorAll('.opt[data-k]').forEach(b=>{
          b.onclick = ()=>{ rec({t:'c', k:b.dataset.k}); panel.classList.remove('hold'); closePanel(); st.pick(b.dataset.k, next); };
        });

      }
      else if(st.t==='inner'){

        const r = rqNext('i');
        if(r){ const o=st.opts.find(x=>x.k===r.k); if(o){ S.extra[n]=S.extra[n]||{}; S.extra[n].inner={k:o.k,x:o.x}; } next(); return; }
        const opts = shuf(st.opts);
        panel.innerHTML = `<div class="inner-badge">🔒 나만 보는 질문 — 이 답은 폰 밖으로 나가지 않아요</div>

          opts.map(o=>`<button class="opt inner" data-k="${o.k}">${o.x}</button>`).join('');
        setTimeout(()=>{ panel.classList.add('up'); openPanel(); }, 250);
        panel.querySelectorAll('.opt').forEach(b=>{
          b.onclick = ()=>{
            const o = st.opts.find(x=>x.k===b.dataset.k);

            S.extra[n].inner = { k:o.k, x:o.x };
            rec({t:'i', k:o.k});
            closePanel(); next();
          };
        });
      }
      else if(st.t==='gauge'){
        // 숫자 추정 슬라이더 — 값은 이 기기에만 남는다
        const r = rqNext('g');

        panel.innerHTML = `<div class="cp-title">${st.title}</div>

        setTimeout(()=>{ panel.classList.add('up'); openPanel(); }, 250);
        panel.querySelector('#gr').oninput = e=>{ v=+e.target.value; panel.querySelector('#gv').textContent = v+'명'; };
        panel.querySelector('#gok').onclick = ()=>{
          S.extra[n] = S.extra[n]||{};
          S.extra[n].guess = v;

      }
      else if(st.t==='dual'){
        // 이중 질문: ① 가장 멋진 선택 → ② 솔직히 진짜 나라면
        const r1 = rqNext('d1');
        if(r1){
          const o = st.opts.find(x=>x.k===r1.k);
          if(o){ S.extra[n]=S.extra[n]||{}; S.extra[n].ideal={k:o.k,x:o.x}; }
          const r2 = rqNext('c');
          if(r2){ applyFree(r2); st.pick(r2.k, next); return; }
          setTimeout(()=>{ panel.classList.add('up'); ask(2); }, 250);
          return;
        }
        function ask(phase){
          const opts = shuf(st.opts);
          const head = phase===1
            ? `<div class="dual-step">질문 ① / ②</div><div class="cp-title">${st.title1}</div>`
            : `<div class="dual-step real">질문 ② / ②</div><div class="cp-title">${st.title2}</div>
               <div style="text-align:center;font-size:13.5px;color:var(--paper-dim);margin:-6px 0 10px">아까 고른 답과 같아도 되고, 달라도 돼요.</div>`;
          panel.innerHTML = head + opts.map(o=>`<button class="opt" data-k="${o.k}">${o.x}${phase===2&&o.tag?`<span class="tag">${o.tag}</span>`:''}</button>`).join('')
            + (phase===2 && st.free ? freeUI(st) : '');
          openPanel();
          panel.querySelectorAll('.opt[data-k]').forEach(b=>{
            b.onclick = ()=>{
              const o = st.opts.find(x=>x.k===b.dataset.k);
              if(phase===1){
                S.extra[n] = S.extra[n]||{};
                S.extra[n].ideal = { k:o.k, x:o.x };
                rec({t:'d1', k:o.k});
                ask(2);
              } else {
                rec({t:'c', k:o.k});
                closePanel(); st.pick(o.k, next);
              }
            };
          });
          if(phase===2 && st.free) wireFree(st, next);
        }
        setTimeout(()=>{ panel.classList.add('up'); ask(1); }, 250);
      }
      else if(st.t==='fakeui'){
        // 진짜 채팅창처럼 생긴 입력바 — 평소 손가락이 하는 대로
        const r = rqNext('c');
        if(r){ applyFree(r); st.pick(r.k, next); return; }
        function bar(){
          panel.innerHTML = `<div class="fakebar">
            <button class="fk-emoji" id="fkE">ㅋㅋㅋㅋ 😂</button>
            <button class="fk-input" id="fkI">답장 쓰기…</button>
            <button class="fk-pass" id="fkP">그냥 넘기기 ▲</button>
          </div>`;
          openPanel();
          panel.querySelector('#fkE').onclick = ()=>{ rec({t:'c',k:'laugh'}); closePanel(); st.pick('laugh', next); };
          panel.querySelector('#fkP').onclick = ()=>{ rec({t:'c',k:'silent'}); closePanel(); st.pick('silent', next); };
          panel.querySelector('#fkI').onclick = sheet;
        }
        function sheet(){
          panel.innerHTML = `<div class="cp-title">뭐라고 보낼까?</div>
            <button class="opt" data-k="speak">이 방에 바로 보낸다 — “야 근데 그건 좀 아니지 않냐”<span class="tag">23명이 다 본다. 분위기 깨는 애가 될 수도 있다</span></button>
            <button class="opt" data-k="dm">민재에게만 따로 보낸다<span class="tag">단톡방에서 말하면 싸움 날 것 같아서</span></button>`
            + (st.free ? freeUI(st) : '')
            + `<button class="opt" data-k="back" style="text-align:center;color:var(--paper-dim)">← 돌아가기</button>`;
          openPanel();
          panel.querySelectorAll('.opt[data-k]').forEach(b=>{
            b.onclick = ()=>{
              if(b.dataset.k==='back'){ bar(); return; }
              rec({t:'c', k:b.dataset.k});
              closePanel(); st.pick(b.dataset.k, next);
            };
          });
          if(st.free) wireFree(st, next);
        }
        setTimeout(()=>{ panel.classList.add('up'); bar(); }, 250);
      }
      else if(st.t==='end'){
        panel.innerHTML = `<div class="cp-title">선택이 끝났어요. 위로 스크롤하면 지나간 대화를 다시 읽을 수 있어요.</div>
          <button class="opt" style="text-align:center;border-color:var(--signal)" id="toR">이 선택이 만든 물결 보기 →</button>`;
        setTimeout(()=>{ panel.classList.add('up'); openPanel(); }, D(400)||60);
        panel.querySelector('#toR').onclick = ()=>finishScenario(n);
      }
      down();
    })();
  }

  play(SCRIPTS[n](play));
}

function finishScenario(n){
  const stance = STANCE_FN[n]();
  S.done[n] = { c1:S.c1, c2:S.c2, stance:stance };
  record(n);
  saveProgress();
  nav(scrRipple, n);
}

    '만약 사회의 모든 사람이 ‘재미있으니까 괜찮아’ 하며 웃는다면 어떻게 될까요? 남을 깎아내리는 말이 ‘하면 안 되는 말’이 아니라 ‘유행하는 말’이 돼요. 이상한 점은 이거예요. 아무도 누군가를 미워할 생각은 없었는데, 누군가는 계속 다치고 있다는 것. 이것이 ‘놀이가 된 혐오’의 가장 무서운 점이에요.'],
  silence:[
    '당신은 아무것도 하지 않았어요. 어느 편도 들지 않았으니 중간에 서 있는 것 같아요. 그런데 한 가지 문제가 있어요. 밈의 대상이 된 사람의 화면에서는, 웃은 사람과 가만히 있던 사람이 구분되지 않는다는 거예요. 둘 다 ‘읽음 23’이라는 똑같은 숫자로 보일 뿐이에요.',
    '3일이 지났어요. 민재는 이렇게 기억해요. “아무도 뭐라고 안 했는데?” 스물세 명이 읽었는데 한 명도 멈추라고 하지 않았으니까요. 그래서 민재에게 그 조용함은 ‘다들 괜찮다는 뜻’이 되어 버렸어요. 당신의 진짜 마음과는 상관없이요.',
    '한 달 뒤, 반에는 ‘웃는 애들’과 ‘가만히 있는 애들’만 남았어요. 사실은 불편하다고 느낀 친구들이 꽤 많았어요. 그런데 서로의 마음을 모르니까, 다들 ‘나만 불편한가 봐’ 하고 조용히 있었던 거예요. 이렇게 해서 ‘모두가 조용한 반’이 만들어져요. 아무도 원하지 않았는데도요.',
    '만약 사회의 모든 사람이 침묵을 고른다면 어떻게 될까요? 목소리 큰 몇 사람의 생각이 마치 모두의 생각인 것처럼 되어 버려요. 민주주의가 무너지는 가장 흔한 방법은 누군가 힘으로 억누르는 게 아니에요. 모두가 그냥 조용히 있는 것 — 그것만으로도 충분히 무너져요.'],
  repair:[
    '가장 좋은 타이밍은 지나갔어요. 하지만 당신은 그냥 넘어가지 않고 되돌아갔어요. 늦은 용기도 용기예요. 마음속에 남아 있던 ‘뭔가 이상한데…’ 하는 불편한 느낌을 당신은 버리지 않았고, 하루가 지나서라도 행동으로 옮겼으니까요.',
    '3일 뒤, 민재가 또 밈을 올렸을 때 처음으로 ㅋㅋ가 아닌 반응이 달렸어요. 한 명이 머뭇거리니까, 다른 한 명도 따라서 머뭇거렸어요. 분위기라는 건 전염되거든요. 나쁜 쪽으로도 퍼지지만 — 좋은 쪽으로도 퍼져요.',
    '한 달이 지나도 지호는 그날을 기억해요. 밈이 아니라, 누군가 다가와 줬던 쉬는 시간을요. 반 전체가 바뀐 건 아니에요. 하지만 지호에게 이 반은 ‘전부 웃는 방’이 아니라 ‘적어도 한 명은 다른 방’이 되었어요. 당하는 사람에게는, 그 한 명이 정말 커요.',
    '만약 모두가 ‘늦었지만 지금이라도 하자’를 고르는 사회라면 어떨까요? 그런 사회는 실수를 전혀 안 하는 사회보다 오히려 튼튼해요. 실수하지 않는 사람은 없으니까요. 민주주의를 지키는 것은 완벽한 시민이 아니라, 틀렸다 싶으면 되돌아올 줄 아는 시민들이에요.'],
  half:[
    '당신은 용기를 내서 말을 꺼냈어요. 그리고 다시 거두었어요. 그 순간의 마음은 충분히 이해할 수 있어요. 친구 사이, 방 분위기, 스물세 명의 시선이 있었으니까요. 다만 이번에 한 가지를 알게 됐어요. 옳은 말은 꺼내는 순간보다, 꺼낸 다음이 더 힘들다는 것을요.',
    '3일 뒤, 친구들은 당신이 처음 한 말보다 마지막에 붙인 ‘ㅋㅋ’를 기억해요. “걔도 결국 웃었잖아.” 사람들은 이야기를 시작한 부분이 아니라, 끝난 부분으로 기억하거든요.',
    '그래도 아무것도 안 남은 건 아니에요. 민재는 밈을 올리기 전에 아주 잠깐 당신을 떠올려요. ‘걔가 또 뭐라고 하려나?’ 절반까지 간 목소리는 절반만큼의 물결을 만들어요. 물결이 아예 없는 것보다는, 분명히 커요.',
    '만약 모두가 절반까지만 말하고 물러서는 사회라면 어떨까요? ‘반대하는 사람이 있긴 했다’는 기록은 남지만, 실제로 바뀌는 것은 없어요. 마지막 한 걸음이 그렇게 어려운 데는 이유가 있어요. 방향을 바꾸는 것은 바로 그 한 걸음이기 때문이에요.'],
  voice:[
    '당신은 말했고, 물러서지 않았어요. 그리고 그 값을 치렀어요. ‘진지충’이라는 놀림, 갑자기 조용해진 방, 화끈거리는 얼굴. 옳은 선택을 했는데 상을 받기는커녕 손해를 봤어요. 적어도 오늘은요. 옳은 일이 언제나 바로 보상받는 것은 아니에요.',
    '3일이 지나도 크게 달라진 것은 없어 보여요. 민재는 사과하지 않았어요. 하지만 자세히 보면 변화가 있어요. 유나가 처음으로 자기 생각을 말했고, 다음 밈에는 웃는 사람이 세 명 줄었어요. 물결은 이렇게, 눈에 잘 안 보이는 곳에서 먼저 퍼지기 시작해요.',
    '한 달 뒤, 우리 반에는 새로운 사실이 하나 생겼어요. ‘그런 밈에 웃지 않는 애도 있다’는 사실이요. 이 사실 하나가 다른 아이들의 마음을 가볍게 해 줬어요. ‘나만 불편했던 게 아니구나’ 하고요. 처음 말하는 사람의 진짜 역할은 상대를 설득하는 게 아니에요. 두 번째 사람이 말할 수 있도록 문을 열어 주는 거예요.',
    '‘모두가 손해를 무릅쓰고 말하는 사회’는 사실 세상에 없어요. 그런 사회가 필요하지도 않아요. 필요한 것은 모두가 아니라, 방마다 한 명이에요. 민주주의는 모두의 용기가 아니라, 여기저기 흩어져 있는 ‘첫 번째 목소리’들이 지탱하고 있어요.']
},
2:{
  blame:[
    '당신은 “무임승차”라는 판정에 힘을 보탰어요. 화가 난 것 자체는 잘못이 아니에요. 정말 고생했으니까요. 다만 그 판정은 시우에게 단 한 번도 묻지 않은 채 내려졌어요. 결과(세 줄)만 보고 원인(게으름)을 정해 버린 거예요. 그런데 원인은 다른 것이었죠.',
    '3일 뒤, 시우는 조 단톡방에서 완전히 조용해졌어요. 무슨 말을 해도 “변명”으로 들릴 것 같으니까요. 한번 ‘무임승차’ 딱지가 붙은 사람은, 그 딱지를 떼기 위해 남들보다 두 배로 증명해야 해요. 그건 생각보다 무거운 짐이에요.',
    '한 달 뒤, 우리 반에서는 조를 짤 때 “쟤랑은 하지 마”라는 말이 자연스러워졌어요. 잘하는 애들끼리 뭉치고, 어려운 사정이 있는 애들은 계속 밀려나요. 그런데 이상하죠. 밀려난 애들의 사정은 조를 짜기 전이나 후나, 여전히 아무도 물어보지 않아요.',
    '만약 사회 전체가 결과만 보고 사람을 판정한다면 어떻게 될까요? “성적이 낮은 건 노력을 안 해서”, “가난한 건 게을러서”라는 말이 상식처럼 돼요. 그러면 출발선이 다르다는 사실은 지워지고, 뒤처진 사람을 도울 이유도 사라져요. 능력만 보는 사회의 함정은, 능력 뒤에 있는 사람과 사정을 안 보게 된다는 거예요.'],
  silent:[
    '당신은 성토에 끼지 않았어요. 하지만 말리지도 않았죠. 그 사이 조 단톡방에서는 시우에 대한 결정이 하나 내려졌어요. 회의에서 기권한 사람도 결정의 일부가 되는 것처럼, 침묵도 그 판정에 한 자리를 차지했어요.',
    '3일 뒤, 시우는 이 조의 모두가 자기를 “무임승차”로 본다고 생각해요. 사실 당신은 그렇게까지 생각하지 않았는데도요. 말하지 않은 마음은 상대에게 전해지지 않아요. 시우의 화면에 보인 것은 성토하는 두 명과, 아무 말 없는 한 명이었어요.',
    '한 달 뒤, 당신은 조별과제 때마다 비슷한 장면을 보게 됐어요. 누군가 몰아세워지고, 당신은 불편해하면서 가만히 있고. 한 번 만들어진 자리는 습관이 돼요. ‘나서지 않는 사람’이라는 자리도요.',
    '만약 모두가 “내 일 아니니까” 하고 가만히 있는 사회라면 어떨까요? 부당하게 판정당하는 사람이 생겨도 아무도 “잠깐, 사정을 들어 보자”고 말하지 않아요. 재판에서 변호인이 없는 것과 비슷해요. 민주주의 사회가 억울한 사람을 만들지 않으려면, ‘일단 들어 보자’고 말하는 사람이 곳곳에 필요해요.'],
  late:[
    '처음에는 당신도 판정하는 쪽에 서 있었거나, 가만히 있었어요. 하지만 시우의 진짜 사정을 마주친 뒤, 당신은 방향을 바꿨어요. “왜 못 했어?” 대신 “무슨 일 있었어?”라고 물었죠. 하루 늦었지만, 질문으로 돌아온 거예요.',
    '3일 뒤, 시우는 당신에게만은 먼저 말을 걸어요. 자기를 몰아세우던 방에서 유일하게 물어봐 준 사람이니까요. 판정은 사람의 입을 닫게 하지만, 질문은 입을 열게 해요.',
    '한 달 뒤, 조별과제에서 누군가 결과물이 부족할 때 당신은 습관처럼 먼저 물어보게 됐어요. “무슨 일 있어?” 물어보면 대부분 이유가 있었어요. 가끔은 정말 게으름인 경우도 있었죠. 그런데 그것도 물어봤기 때문에 알 수 있었던 거예요.',
    '만약 사회 전체가 판정 전에 한 번 묻는 습관을 가진다면 어떨까요? 학교에서, 회사에서, 뉴스 댓글에서 “일단 사정을 들어 보자”가 먼저 나와요. 틀린 판정이 줄어들고, 억울한 사람이 줄어들어요. 그 습관은 거창한 제도가 아니라, 오늘 당신이 한 것 같은 질문 하나에서 시작돼요.'],
  expose:[
    '당신은 시우를 돕고 싶었어요. 그 마음은 진짜였어요. 그런데 시우의 사정을 시우의 허락 없이 모두에게 알렸어요. 오해는 풀렸지만, 시우는 자기 이야기가 언제 어디까지 알려질지를 정할 기회를 잃었어요. 좋은 의도로도, 남의 이야기의 주인 자리를 대신 차지할 수는 없어요.',
    '3일 뒤, 아이들은 시우에게 잘해 줘요. 그런데 시우는 그 친절이 불편해요. “쟤 집에 컴퓨터도 없대”라는 말이 어디까지 퍼졌는지 알 수 없으니까요. 동정받는 것과 존중받는 것은 다른 일이에요.',
    '한 달 뒤, 시우는 힘든 일이 있어도 아무에게도 말하지 않게 됐어요. 한 번 말했더니 반 전체가 알게 됐던 경험 때문이에요. 사정을 알린 건 시우를 지키기 위해서였는데, 결과적으로 시우가 도움을 청할 문이 하나 닫혔어요.',
    '만약 사회 전체가 “좋은 뜻이면 남의 사정을 알려도 된다”고 생각하면 어떻게 될까요? 어려운 사람일수록 자기 이야기를 숨기게 돼요. 알려지는 순간 자기 이야기에 대한 결정권을 잃으니까요. 돕는 일의 첫 번째 규칙은 그래서 이거예요. 그 사람의 이야기는, 그 사람의 것.'],
  respect:[
    '당신은 두 가지를 동시에 해냈어요. 시우의 사정을 알아봐 준 것, 그리고 그 사정을 시우의 것으로 남겨 둔 것. “말해도 돼?”라는 한 마디, 혹은 조용히 옆에서 같이 고치는 오후 — 도움에도 예의가 있다는 걸 보여 준 거예요.',
    '3일 뒤, 발표는 무사히 끝났어요. 더 중요한 건 시우가 이 조에서 처음으로 마음을 놓았다는 거예요. 자기가 어려울 때 몰아세우지 않고, 자기 이야기를 함부로 옮기지도 않는 사람이 있다는 걸 알았으니까요.',
    '한 달 뒤, 시우의 공책 이야기가 조금씩 알려졌어요. 시우가 스스로 말할 준비가 됐을 때, 스스로 말했거든요. 아이들은 그제야 알았어요. ‘세 줄’은 능력이 부족해서가 아니라, 컴퓨터가 없어서 생긴 일이었다는 걸요. 그 뒤로 우리 반에는 작은 변화가 생겼어요. 누군가를 “못한다”고 단정하기 전에, “무슨 일 있어?”라고 먼저 물어보는 아이들이 하나둘 늘어났어요.',
    '만약 사회 전체가 이렇게 움직인다면 어떨까요? 결과가 부족한 사람에게 먼저 “무슨 일이야?”라고 묻고, 그 사람의 이야기는 그 사람이 결정하게 두는 것. 그런 사회에서는 출발선이 달랐던 사람도 다시 뛸 수 있어요. 능력을 키우는 가장 좋은 방법은, 사람을 먼저 보는 것일지도 몰라요.']
},
3:{

function scrRipple(n){
  if(!S.done[n]){ navHome(); return; }
  const seen = S.ui.rippleSeen[n] = (S.ui.rippleSeen[n] && S.ui.rippleSeen[n].length===4) ? S.ui.rippleSeen[n] : (S.ui.rippleSeen[n]||[false,false,false,false]);
  let step = 0;
  const R = [46,84,122,160];
  const rings = RINGS_LB[n];
  const sc = el(`<section class="screen night" style="padding:0"><div class="ripple-wrap">
    <div class="eyebrow">${SC_META[n].no} · 물결 지도</div>
    <h2 style="margin-bottom:2px">하나의 선택은<br>어디까지 갈까</h2>
    <svg class="ripple-svg" viewBox="0 0 360 360" aria-hidden="true">
      ${R.map((r,i)=>`<circle class="ring-c" id="rc${i}" cx="180" cy="180" r="${r}"/>`).join('')}
      <circle class="pulse" cx="180" cy="180" r="5"/>
      <circle cx="180" cy="180" r="5" fill="var(--signal)"/>
      ${R.map((r,i)=>`<text class="ring-lb" id="rl${i}" x="180" y="${180-r-7}" text-anchor="middle">${rings[i]}</text>`).join('')}
    </svg>
    <div class="timeline">${WHEN.map((w,i)=>`<button class="t-step" id="ts${i}" aria-label="${w} 단계 보기">${w}</button>`).join('')}</div>
    <p class="t-hint" id="thint">위의 단계를 눌러 언제든 다시 볼 수 있어요.</p>
    <div class="ripple-text"><div class="rt-when" id="rw"></div><div class="rt-body" id="rb"></div>
      <div class="rt-nav">
        <button class="prev" id="prev">← 이전</button>
        <button id="nextstep">다음 →</button>
      </div>
    </div>
    <div class="spacer"></div>
    <button class="btn" id="nx">다음 물결 →</button>
  </div></section>`);
  show(sc);
  const texts = RIPPLE[n][S.done[n].stance];
  function go(to){ step = Math.max(0, Math.min(3, to)); render(); }
  function render(){
    if(!seen[step]){ seen[step] = true; saveProgress(); }
    for(let i=0;i<4;i++){
      sc.querySelector('#rc'+i).classList.toggle('hot', i===step);
      sc.querySelector('#rl'+i).classList.toggle('hot', i===step);
      const ts = sc.querySelector('#ts'+i);
      ts.classList.toggle('on', i===step);
      ts.classList.toggle('seen', seen[i] && i!==step);
    }
    sc.querySelector('#rw').textContent = WHEN[step] + ' · ' + rings[step];
    sc.querySelector('#rb').innerHTML = dicify(texts[step]);
    sc.querySelector('#prev').disabled = step===0;
    sc.querySelector('#nextstep').disabled = step===3;
    const allSeen = seen.every(Boolean);
    const nx = sc.querySelector('#nx');
    nx.textContent = allSeen ? '다른 사람들은 어떻게 했을까 →' : `네 단계를 모두 본 뒤에 넘어가요 (${seen.filter(Boolean).length}/4)`;
    nx.disabled = !allSeen; nx.style.opacity = allSeen ? 1 : .45;
    sc.querySelector('#thint').textContent = allSeen
      ? '네 단계를 모두 봤어요. 아무 단계나 다시 눌러 확인할 수 있어요.'
      : '위의 단계를 눌러 언제든 다시 볼 수 있어요. 네 단계를 모두 보면 다음으로 넘어가요.';
  }
  WHEN.forEach((w,i)=> sc.querySelector('#ts'+i).onclick = ()=>go(i));
  sc.querySelector('#prev').onclick = ()=>go(step-1);
  sc.querySelector('#nextstep').onclick = ()=>go(step+1);
  sc.querySelector('#nx').onclick = ()=>{ if(seen.every(Boolean)) nav(scrData, n); };
  render();
  coach('ripple','위의 단계 버튼(지금 → 모두가 그렇다면)을 눌러 미래를 살펴보세요.');
}

    <div class="eyebrow">${SC_META[n].no} · 우리들의 선택</div>
    <h2>당신만<br>그런 게 아니에요</h2>
    <p>같은 상황에 선 사람들이 25명짜리 교실에 모여 있다면, 첫 선택은 이렇게 나뉘어요.</p>
    <div class="waffle" id="wf"></div>
    <div id="lg" style="max-width:340px;margin:8px auto 0"></div>
    <p class="note" id="src" style="text-align:center"></p>
    <p style="margin-top:18px">여기서 중요한 것 하나 — 가만히 있기를 고른 사람들은 나쁜 사람들이 아니에요.
    분위기를 깨는 게 무섭고, 혼자 눈에 띄는 게 부담스러운 건 사람이라면 누구나 그래요.
    그런데 바로 그래서, 목소리를 내는 일에는 <strong>연습</strong>이 필요해요.
    지금 이 화면이 그 연습장이고요.</p>
    <div class="spacer"></div>
    <button class="btn" id="nx">헌법 렌즈 끼고 다시 보기 →</button>
  </section>`);
  show(sc);
  dicifyIn(sc, 'p');
  sc.querySelector('#nx').onclick = ()=>nav(scrLaw, n);
  const COLORS = ['#D98E5F','#8A94A6','#6FA8FF','#7FB59B'];
  fetchStats(stats=>{
    const st = stats && stats[String(n)] && stats[String(n)].total>0 ? stats[String(n)] : null;
    const data = st ? st.c1 : DEMO[n];
    const keys = Object.keys(C1L[n]);
    const total = keys.reduce((a,k)=>a+(data[k]||0),0) || 1;
    // 최대잔여법으로 25석 배분 (합이 정확히 25가 되게)
    const raw = keys.map(k=>(data[k]||0)/total*25);
    const seats = raw.map(Math.floor);
    let left = 25 - seats.reduce((a,b)=>a+b,0);
    raw.map((v,i)=>[v-Math.floor(v),i]).sort((a,b)=>b[0]-a[0])
       .slice(0,left).forEach(([_,i])=>seats[i]++);
    const mineIdx = keys.indexOf(S.done[n].c1);
    const wf = sc.querySelector('#wf');
    let cell = 0;
    keys.forEach((k,i)=>{
      for(let j=0;j<seats[i];j++){
        const me = (i===mineIdx && j===0);
        wf.appendChild(el(`<i class="${me?'me':''}" style="background:${COLORS[i]};animation-delay:${cell*45}ms"></i>`));
        cell++;
      }
    });
    const lg = sc.querySelector('#lg');
    keys.forEach((k,i)=>{
      const pct = Math.round((data[k]||0)/total*100);
      lg.appendChild(el(`<div class="legend-row ${i===mineIdx?'mine':''}">
        <span class="sw" style="background:${COLORS[i]}"></span>
        <span>${C1L[n][k]}${i===mineIdx?' ⭐ 나':''}</span>
        <span class="pc">${seats[i]}명 · ${pct}%</span></div>`));
    });
    sc.querySelector('#src').textContent = st
      ? `이 앱으로 같은 상황을 겪은 ${st.total}명의 실제 기록을 25명 비율로 바꾼 그림이에요.`
      : `아직 기록이 충분하지 않아 예시 분포예요. 기록이 쌓이면 실제 분포로 바뀌어요.`;
    // S3: 아까의 예상과 실제를 나란히
    if(n===3 && S.extra[3] && S.extra[3].guess!=null){
      const shareSeats = seats[keys.indexOf('share')];
      sc.querySelector('#lg').after(el(`<div class="law-card" style="margin-top:14px">
        <div class="art" style="color:#8A6A2F">아까 한 예상, 기억나요?</div>
        <div class="sub" style="font-size:15.5px">당신의 예상: 25명 중 <b>${S.extra[3].guess}명</b>이 확인 없이 바로 공유<br>
        이 화면의 기록: 25명 중 <b>${shareSeats}명</b>이 바로 공유<br><br>
        ${S.extra[3].guess>shareSeats
          ? '예상이 실제보다 많았어요. 사람들은 “남들은 다 퍼뜨릴 것”이라고 실제보다 높게 예상하는 경우가 많아요. 그리고 그 예상 때문에 “나 하나쯤 퍼뜨려도(또는 조용히 있어도) 똑같다”고 생각하게 돼요.'
          : S.extra[3].guess<shareSeats
          ? '예상이 실제보다 적었어요. 확인 없이 공유하는 사람은 생각보다 많아요. 그래서 “이거 진짜야?”라고 묻는 한 사람의 값이 생각보다 커요.'
          : '예상이 거의 정확했어요. 사람들이 어떻게 움직이는지 잘 보고 있다는 뜻이에요. 그 눈을 다음엔 자기 손가락에도 써 보세요.'}
        </div></div>`));
    }
  });
}

function thinkFeedback(t){
  const has = re=>re.test(t);
  if(t.length<10) return '짧아도 괜찮아요. 한 문장의 생각도 진짜 생각이에요. 이 문장은 마지막 거울에서 다시 만나게 될 거예요.';
  if(has(/물어|묻|질문/)) return '“물어본다”는 말이 문장에 들어 있네요. 네 개의 물결을 통과하는 열쇠를 정확히 짚었어요. 이 문장은 마지막 거울에서 다시 만나게 될 거예요.';
  if(has(/확인|출처|검색|사실|가짜/)) return '“확인”하려는 마음이 문장에 담겼어요. 퍼지는 것보다 빠른 건 없지만, 멈추는 건 언제나 가능하죠. 이 문장은 마지막 거울에서 다시 만나게 될 거예요.';
  if(has(/존엄|평등|권리|자유|헌법|주권/)) return '헌법의 말을 자기 문장으로 옮겨 적었네요. 조문은 외울 때가 아니라 이렇게 내 말이 될 때 힘이 생겨요. 이 문장은 마지막 거울에서 다시 만나게 될 거예요.';
  return '당신의 문장이 물결 지도에 담겼어요. 이 생각은 마지막 거울에서 다시 만나게 될 거예요.';
}
